<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>एडवांस डिजिटल बोर्ड - स्मार्ट क्लासरूम</title>
    <style>
        /* ── Reset & Base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f172a;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        /* ── Header / Toolbar ── */
        header {
            background: #0f172a;
            border-bottom: 2px solid #1e293b;
            padding: 6px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            flex-shrink: 0;
            z-index: 10;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .logo small {
            font-weight: 400;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-left: 4px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .toolbar-group label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-right: 2px;
        }

        button,
        select,
        input[type="color"],
        input[type="range"] {
            padding: 4px 10px;
            border-radius: 5px;
            border: none;
            background: #334155;
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.15s;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        button:hover,
        select:hover {
            background: #475569;
        }
        button.active {
            background: #2563eb;
            font-weight: 600;
            box-shadow: 0 0 0 2px #3b82f6;
        }
        input[type="color"] {
            width: 32px;
            padding: 2px;
            background: transparent;
            border: 2px solid #475569;
            cursor: pointer;
        }
        input[type="range"] {
            width: 70px;
            padding: 0;
            background: transparent;
            accent-color: #3b82f6;
            height: 4px;
        }
        .sep {
            width: 1px;
            height: 28px;
            background: #334155;
            margin: 0 4px;
        }

        /* टाइमर */
        .timer-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0284c7;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .timer-box button {
            background: #0f172a;
            padding: 2px 10px;
            font-size: 0.7rem;
            height: 24px;
        }

        /* पेज नेविगेशन */
        .page-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .page-nav button {
            background: #334155;
            padding: 4px 10px;
            font-size: 0.75rem;
            height: 28px;
            min-width: 28px;
        }
        .page-nav .page-num {
            font-weight: 600;
            font-size: 0.85rem;
            min-width: 36px;
            text-align: center;
            color: #e2e8f0;
        }

        /* ── Canvas Container ── */
        #canvas-container {
            flex: 1;
            position: relative;
            background: #ffffff;
            overflow: hidden;
            cursor: crosshair;
        }
        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            transition: none;
        }

        /* ── Background Styles ── */
        .bg-blank {
            background: #ffffff;
        }
        .bg-grid {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bg-lines {
            background-image: linear-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 100% 30px;
        }
        .bg-blackboard {
            background: #15803d;
        }

        /* ── Zoom indicator ── */
        .zoom-indicator {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #e2e8f0;
            pointer-events: none;
            border: 1px solid #334155;
        }

        /* ── Sticky Note ── */
        .sticky-note {
            position: absolute;
            min-width: 140px;
            min-height: 80px;
            padding: 12px 16px;
            background: #fde047;
            color: #1e293b;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
            cursor: grab;
            word-wrap: break-word;
            z-index: 20;
            border-left: 4px solid #ca8a04;
            transition: box-shadow 0.2s;
            user-select: text;
        }
        .sticky-note:hover {
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }
        .sticky-note .note-close {
            position: absolute;
            top: 4px;
            right: 8px;
            cursor: pointer;
            font-size: 1rem;
            color: #854d0e;
            opacity: 0.6;
            background: none;
            border: none;
            padding: 0 4px;
        }
        .sticky-note .note-close:hover {
            opacity: 1;
        }
        .sticky-note .note-text {
            outline: none;
            margin-top: 4px;
            min-height: 40px;
        }

        /* ── Virtual Keyboard ── */
        #keyboard-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(6px);
            padding: 12px 16px 20px;
            border-top: 2px solid #334155;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
        }
        #keyboard-container.open {
            display: flex;
        }
        .keyboard-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .keyboard-row button {
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 8px 12px;
            min-width: 36px;
            height: 44px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
            flex: 0 0 auto;
        }
        .keyboard-row button:hover {
            background: #334155;
        }
        .keyboard-row button:active {
            background: #2563eb;
            transform: scale(0.95);
        }
        .keyboard-row button.key-wide {
            min-width: 60px;
        }
        .keyboard-row button.key-space {
            min-width: 140px;
        }
        .keyboard-text-display {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 8px 16px;
            min-width: 200px;
            min-height: 40px;
            color: #f1f5f9;
            font-size: 1.1rem;
            text-align: center;
            width: 80%;
            max-width: 500px;
            word-break: break-all;
        }
        .keyboard-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .keyboard-actions button {
            padding: 6px 18px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .keyboard-actions button:hover {
            background: #3b82f6;
        }
        .keyboard-actions button.close-kb {
            background: #dc2626;
        }
        .keyboard-actions button.close-kb:hover {
            background: #ef4444;
        }

        /* ── Selection highlight ── */
        .selected-object {
            outline: 3px solid #3b82f6;
            outline-offset: 4px;
            animation: pulse-border 1.2s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%,
            100% {
                outline-color: #3b82f6;
            }
            50% {
                outline-color: #60a5fa;
            }
        }

        /* ── Print Styles ── */
        @media print {
            header,
            #keyboard-container {
                display: none !important;
            }
            .sticky-note {
                display: none !important;
            }
            #canvas-container {
                background: #fff !important;
            }
            .zoom-indicator {
                display: none !important;
            }
            body {
                background: #fff;
            }
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            header {
                padding: 4px 8px;
                gap: 4px 10px;
            }
            .toolbar-group {
                padding: 3px 6px;
                gap: 3px;
            }
            button,
            select,
            input[type="color"],
            input[type="range"] {
                font-size: 0.7rem;
                padding: 2px 6px;
                height: 26px;
            }
            .logo {
                font-size: 0.9rem;
            }
            .timer-box {
                font-size: 0.75rem;
                padding: 2px 10px;
            }
            .page-nav .page-num {
                min-width: 28px;
                font-size: 0.75rem;
            }
            input[type="range"] {
                width: 50px;
            }
            .keyboard-row button {
                padding: 6px 8px;
                min-width: 28px;
                height: 36px;
                font-size: 0.8rem;
            }
            .keyboard-row button.key-space {
                min-width: 80px;
            }
        }
        @media (max-width: 540px) {
            .toolbar-group.hide-mobile {
                display: none;
            }
            header {
                gap: 4px 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── HEADER ─── -->
    <header>
        <div class="logo">🖊️ डिजिटल बोर्ड <small>v3.1</small></div>

        <!-- टूल्स समूह 1: ड्रॉइंग -->
        <div class="toolbar-group">
            <button id="btn-pen" class="active" onclick="setMode('pen')" title="पेन">✏️</button>
            <button id="btn-eraser" onclick="setMode('eraser')" title="इरेज़र">🧹</button>
            <button id="btn-highlighter" onclick="setMode('highlighter')" title="हाइलाइटर">🟡</button>
            <div class="sep"></div>
            <label>रंग</label>
            <input type="color" id="colorPicker" value="#000000" onchange="changeColor(this.value)" />
            <label>साइज़</label>
            <input type="range" id="lineWidth" min="1" max="40" value="3" oninput="changeLineWidth(this.value)" />
            <span id="sizeDisplay" style="font-size:0.7rem;color:#94a3b8;min-width:22px;">3</span>
        </div>

        <!-- आकृति + भराव -->
        <div class="toolbar-group">
            <label>आकृति</label>
            <select id="shapeSelect" onchange="setShape(this.value)">
                <option value="none">🖊️ मुक्त</option>
                <option value="line">╱ रेखा</option>
                <option value="rect">▭ आयत</option>
                <option value="circle">◯ वृत्त</option>
            </select>
            <button id="btn-fill" onclick="toggleFill()" style="background:#334155;" title="भराव">⬛ भरें</button>
            <label>लाइन</label>
            <select id="lineStyleSelect" onchange="setLineStyle(this.value)">
                <option value="solid">——</option>
                <option value="dashed">- - -</option>
                <option value="dotted">···</option>
            </select>
        </div>

        <!-- अंडो / रीडो + साफ़ + सेव -->
        <div class="toolbar-group">
            <button onclick="undo()" title="पूर्ववत (Ctrl+Z)">↩️</button>
            <button onclick="redo()" title="फिर से करें (Ctrl+Y)">↪️</button>
            <div class="sep"></div>
            <button onclick="clearCanvas()" style="background:#dc2626;">🗑️</button>
            <button onclick="downloadBoard()" style="background:#16a34a;">💾 PNG</button>
            <button onclick="exportPDF()" style="background:#9333ea;">📄 PDF</button>
            <button onclick="toggleFullscreen()" title="पूर्ण स्क्रीन">⛶</button>
        </div>

        <!-- पेज नेविगेशन -->
        <div class="toolbar-group page-nav">
            <button onclick="prevPage()" title="पिछला पेज">◀</button>
            <span class="page-num" id="pageNum">1 / 1</span>
            <button onclick="nextPage()" title="अगला पेज">▶</button>
            <button onclick="addPage()" style="background:#2563eb;" title="नया पेज">＋</button>
            <button onclick="deletePage()" style="background:#b91c1c;" title="पेज हटाएं">✕</button>
        </div>

        <!-- मूव + कीपैड + गैलरी -->
        <div class="toolbar-group">
            <button id="btn-move" onclick="setMode('move')" title="मूव (खिसकाएं)">↕️</button>
            <button id="btn-keyboard" onclick="toggleKeyboard()" style="background:#f59e0b;" title="कीपैड">⌨️</button>
            <button id="btn-gallery" onclick="document.getElementById('galleryLoader').click()" style="background:#8b5cf6;" title="गैलरी से फोटो">🖼️</button>
            <input type="file" id="galleryLoader" accept="image/*" style="display:none;" onchange="loadGalleryImage(event)" multiple />
            <label>साइज़</label>
            <input type="range" id="objectSizeSlider" min="20" max="250" value="100" oninput="setObjectSize(this.value)" />
            <span id="objectSizeDisplay" style="font-size:0.7rem;color:#94a3b8;min-width:28px;">100%</span>
        </div>

        <!-- टाइमर -->
        <div class="timer-box">
            ⏱️ <span id="timerDisplay">00:00</span>
            <button onclick="toggleTimer()" id="timerBtn">शुरू</button>
            <button onclick="resetTimer()">रीसेट</button>
        </div>
    </header>

    <!-- ─── CANVAS ─── -->
    <div id="canvas-container" class="bg-blank">
        <canvas id="board"></canvas>
        <div class="zoom-indicator" id="zoomIndicator">🔍 100%</div>
    </div>

    <!-- ─── VIRTUAL KEYBOARD ─── -->
    <div id="keyboard-container">
        <div class="keyboard-text-display" id="keyboardTextDisplay">📝 टाइप करें...</div>
        <div class="keyboard-row">
            <button onclick="keyPress('1')">1</button><button onclick="keyPress('2')">2</button><button onclick="keyPress('3')">3</button>
            <button onclick="keyPress('4')">4</button><button onclick="keyPress('5')">5</button><button onclick="keyPress('6')">6</button>
            <button onclick="keyPress('7')">7</button><button onclick="keyPress('8')">8</button><button onclick="keyPress('9')">9</button>
            <button onclick="keyPress('0')">0</button>
        </div>
        <div class="keyboard-row">
            <button onclick="keyPress('क')">क</button><button onclick="keyPress('ख')">ख</button><button onclick="keyPress('ग')">ग</button>
            <button onclick="keyPress('घ')">घ</button><button onclick="keyPress('च')">च</button><button onclick="keyPress('छ')">छ</button>
            <button onclick="keyPress('ज')">ज</button><button onclick="keyPress('झ')">झ</button><button onclick="keyPress('ट')">ट</button>
            <button onclick="keyPress('ठ')">ठ</button><button onclick="keyPress('ड')">ड</button><button onclick="keyPress('ढ')">ढ</button>
        </div>
        <div class="keyboard-row">
            <button onclick="keyPress('त')">त</button><button onclick="keyPress('थ')">थ</button><button onclick="keyPress('द')">द</button>
            <button onclick="keyPress('ध')">ध</button><button onclick="keyPress('न')">न</button><button onclick="keyPress('प')">प</button>
            <button onclick="keyPress('फ')">फ</button><button onclick="keyPress('ब')">ब</button><button onclick="keyPress('भ')">भ</button>
            <button onclick="keyPress('म')">म</button><button onclick="keyPress('य')">य</button><button onclick="keyPress('र')">र</button>
        </div>
        <div class="keyboard-row">
            <button onclick="keyPress('ल')">ल</button><button onclick="keyPress('व')">व</button><button onclick="keyPress('श')">श</button>
            <button onclick="keyPress('ष')">ष</button><button onclick="keyPress('स')">स</button><button onclick="keyPress('ह')">ह</button>
            <button onclick="keyPress('क्ष')">क्ष</button><button onclick="keyPress('त्र')">त्र</button><button onclick="keyPress('ज्ञ')">ज्ञ</button>
        </div>
        <div class="keyboard-row">
            <button onclick="keyPress('A')">A</button><button onclick="keyPress('B')">B</button><button onclick="keyPress('C')">C</button>
            <button onclick="keyPress('D')">D</button><button onclick="keyPress('E')">E</button><button onclick="keyPress('F')">F</button>
            <button onclick="keyPress('G')">G</button><button onclick="keyPress('H')">H</button><button onclick="keyPress('I')">I</button>
            <button onclick="keyPress('J')">J</button><button onclick="keyPress('K')">K</button><button onclick="keyPress('L')">L</button>
            <button onclick="keyPress('M')">M</button><button onclick="keyPress('N')">N</button><button onclick="keyPress('O')">O</button>
            <button onclick="keyPress('P')">P</button><button onclick="keyPress('Q')">Q</button><button onclick="keyPress('R')">R</button>
            <button onclick="keyPress('S')">S</button><button onclick="keyPress('T')">T</button><button onclick="keyPress('U')">U</button>
            <button onclick="keyPress('V')">V</button><button onclick="keyPress('W')">W</button><button onclick="keyPress('X')">X</button>
            <button onclick="keyPress('Y')">Y</button><button onclick="keyPress('Z')">Z</button>
        </div>
        <div class="keyboard-row">
            <button onclick="keyPress(' ') " class="key-space">␣ स्पेस</button>
            <button onclick="keyBackspace()" class="key-wide">⌫ बैक</button>
            <button onclick="keyClear()" style="background:#dc2626;">✖ साफ़</button>
        </div>
        <div class="keyboard-actions">
            <button onclick="insertKeyboardText()">✅ इन्सर्ट</button>
            <button class="close-kb" onclick="toggleKeyboard()">✕ बंद करें</button>
        </div>
    </div>

    <!-- ─── STICKY NOTE TEMPLATE ─── -->
    <div id="noteTemplate" style="display:none;">
        <div class="sticky-note" style="left:80px;top:80px;">
            <button class="note-close" onclick="this.parentElement.remove()">✕</button>
            <div class="note-text" contenteditable="true">📝 नोट लिखें...</div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════════
        const state = {
            mode: 'pen', // pen | eraser | highlighter | move
            color: '#000000',
            lineWidth: 3,
            shape: 'none',
            fillShape: false,
            lineStyle: 'solid',
            zoom: 1,
            panX: 0,
            panY: 0,
            // Pages: { drawingData, images: [], texts: [] }
            pages: [],
            currentPage: 0,
            // History (drawing only)
            history: [],
            historyIndex: -1,
            maxHistory: 40,
            // Drawing state
            isDrawing: false,
            startX: 0,
            startY: 0,
            snapshot: null,
            // Objects: images + texts (unified)
            selectedObjectType: null, // 'image' | 'text'
            selectedObjectIndex: -1,
            isDraggingObject: false,
            dragOffsetX: 0,
            dragOffsetY: 0,
            // Text tool
            textInput: null,
            // Timer
            timerSeconds: 0,
            timerInterval: null,
            // Keyboard
            keyboardText: '',
            // Object size
            objectScale: 1.0,
        };

        // ═══════════════════════════════════════════════════════════════
        //  DOM REFS
        // ═══════════════════════════════════════════════════════════════
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const colorPicker = document.getElementById('colorPicker');
        const lineWidthRange = document.getElementById('lineWidth');
        const sizeDisplay = document.getElementById('sizeDisplay');
        const shapeSelect = document.getElementById('shapeSelect');
        const lineStyleSelect = document.getElementById('lineStyleSelect');
        const pageNumSpan = document.getElementById('pageNum');
        const zoomIndicator = document.getElementById('zoomIndicator');
        const keyboardContainer = document.getElementById('keyboard-container');
        const keyboardTextDisplay = document.getElementById('keyboardTextDisplay');
        const objectSizeSlider = document.getElementById('objectSizeSlider');
        const objectSizeDisplay = document.getElementById('objectSizeDisplay');

        // ═══════════════════════════════════════════════════════════════
        //  CANVAS SIZING & RENDER
        // ═══════════════════════════════════════════════════════════════
        function resizeCanvas() {
            let data = null;
            if (canvas.width > 0 && canvas.height > 0) {
                data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            if (data) {
                ctx.putImageData(data, 0, 0);
            } else {
                ctx.fillStyle = getBgColor();
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            applyZoomAndPan();
            renderAll();
        }

        window.addEventListener('resize', resizeCanvas);

        function getBgColor() {
            if (container.classList.contains('bg-blackboard')) return '#15803d';
            return '#ffffff';
        }

        function applyZoomAndPan() {
            const z = state.zoom;
            const px = state.panX;
            const py = state.panY;
            canvas.style.transform = `scale(${z}) translate(${px/z}px, ${py/z}px)`;
            canvas.style.transformOrigin = '0 0';
            zoomIndicator.textContent = `🔍 ${Math.round(z * 100)}%`;
        }

        // ── Render: drawing + images + texts ──
        function renderAll() {
            // Clear canvas
            ctx.fillStyle = getBgColor();
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const page = state.pages[state.currentPage];
            if (page) {
                // Drawing data
                if (page.drawingData) {
                    ctx.putImageData(page.drawingData, 0, 0);
                }
                // Images
                if (page.images) {
                    page.images.forEach(img => {
                        if (img.imgElement) {
                            ctx.drawImage(img.imgElement, img.x, img.y, img.width, img.height);
                        }
                    });
                }
                // Texts
                if (page.texts) {
                    page.texts.forEach(t => {
                        ctx.font = `${t.fontSize || 28}px "${t.fontFamily || 'Segoe UI'}", sans-serif`;
                        ctx.fillStyle = t.color || '#000000';
                        ctx.globalAlpha = 1;
                        ctx.setLineDash([]);
                        ctx.fillText(t.text, t.x, t.y);
                    });
                }
            }
            // Save drawingData after render (for history)
            if (page) {
                page.drawingData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
        }

        function saveCurrentPageData() {
            if (canvas.width === 0 || canvas.height === 0) return;
            const page = state.pages[state.currentPage];
            if (page) {
                page.drawingData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                // images and texts are already stored
            }
        }

        function loadPage(index) {
            if (index < 0 || index >= state.pages.length) return;
            state.currentPage = index;
            const page = state.pages[index];
            if (!page) {
                state.pages[index] = { drawingData: null, images: [], texts: [] };
            }
            renderAll();
            state.history = [];
            state.historyIndex = -1;
            saveHistory();
            updatePageUI();
            applyZoomAndPan();
            // Clear selection
            state.selectedObjectType = null;
            state.selectedObjectIndex = -1;
        }

        function addPage() {
            saveCurrentPageData();
            state.pages.push({ drawingData: null, images: [], texts: [] });
            state.currentPage = state.pages.length - 1;
            ctx.fillStyle = getBgColor();
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            state.pages[state.currentPage].drawingData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            state.history = [];
            state.historyIndex = -1;
            saveHistory();
            updatePageUI();
            applyZoomAndPan();
            renderAll();
        }

        function deletePage() {
            if (state.pages.length <= 1) {
                alert('कम से कम एक पेज होना चाहिए!');
                return;
            }
            saveCurrentPageData();
            state.pages.splice(state.currentPage, 1);
            if (state.currentPage >= state.pages.length) state.currentPage = state.pages.length - 1;
            loadPage(state.currentPage);
            updatePageUI();
        }

        function nextPage() {
            if (state.currentPage < state.pages.length - 1) {
                saveCurrentPageData();
                loadPage(state.currentPage + 1);
            }
        }

        function prevPage() {
            if (state.currentPage > 0) {
                saveCurrentPageData();
                loadPage(state.currentPage - 1);
            }
        }

        function updatePageUI() {
            pageNumSpan.textContent = `${state.currentPage + 1} / ${state.pages.length}`;
        }

        // ═══════════════════════════════════════════════════════════════
        //  HISTORY
        // ═══════════════════════════════════════════════════════════════
        function saveHistory() {
            if (canvas.width === 0 || canvas.height === 0) return;
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }
            state.history.push(data);
            if (state.history.length > state.maxHistory) {
                state.history.shift();
            }
            state.historyIndex = state.history.length - 1;
            if (state.pages[state.currentPage]) {
                state.pages[state.currentPage].drawingData = data;
            }
        }

        function undo() {
            if (state.historyIndex <= 0) return;
            state.historyIndex--;
            const data = state.history[state.historyIndex];
            if (data) {
                ctx.putImageData(data, 0, 0);
                if (state.pages[state.currentPage]) {
                    state.pages[state.currentPage].drawingData = data;
                }
                renderAll();
            }
        }

        function redo() {
            if (state.historyIndex >= state.history.length - 1) return;
            state.historyIndex++;
            const data = state.history[state.historyIndex];
            if (data) {
                ctx.putImageData(data, 0, 0);
                if (state.pages[state.currentPage]) {
                    state.pages[state.currentPage].drawingData = data;
                }
                renderAll();
            }
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault();
                undo(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault();
                redo(); }
            if (e.key === 'Escape') {
                if (state.mode === 'move') setMode('pen');
                closeKeyboard();
            }
        });

        // ═══════════════════════════════════════════════════════════════
        //  TOOL FUNCTIONS
        // ═══════════════════════════════════════════════════════════════
        function setMode(mode) {
            state.mode = mode;
            document.querySelectorAll('#btn-pen, #btn-eraser, #btn-highlighter, #btn-move').forEach(b => b.classList.remove(
            'active'));
            const btnMap = { pen: 'btn-pen', eraser: 'btn-eraser', highlighter: 'btn-highlighter', move: 'btn-move' };
            if (btnMap[mode]) document.getElementById(btnMap[mode]).classList.add('active');

            if (mode !== 'pen' && mode !== 'highlighter') {
                shapeSelect.value = 'none';
                state.shape = 'none';
            }
            canvas.style.cursor = mode === 'move' ? 'grab' : 'crosshair';
            state.selectedObjectType = null;
            state.selectedObjectIndex = -1;
            updateContext();
            renderAll();
        }

        function changeColor(color) {
            state.color = color;
            if (state.mode === 'eraser') setMode('pen');
            updateContext();
        }

        function changeLineWidth(val) {
            state.lineWidth = parseInt(val);
            sizeDisplay.textContent = val;
            updateContext();
        }

        function setShape(shape) {
            state.shape = shape;
            if (shape !== 'none' && state.mode !== 'pen') setMode('pen');
            updateContext();
        }

        function toggleFill() {
            state.fillShape = !state.fillShape;
            const btn = document.getElementById('btn-fill');
            btn.style.background = state.fillShape ? '#2563eb' : '#334155';
            btn.textContent = state.fillShape ? '⬛ भरें ✓' : '⬛ भरें';
        }

        function setLineStyle(style) {
            state.lineStyle = style;
            updateContext();
        }

        function updateContext() {
            let color = state.color;
            if (state.mode === 'eraser') {
                color = getBgColor();
            } else if (state.mode === 'highlighter') {
                ctx.globalAlpha = 0.45;
                ctx.strokeStyle = '#facc15';
                ctx.fillStyle = '#facc15';
                ctx.lineWidth = state.lineWidth * 2.5;
            } else {
                ctx.globalAlpha = 1;
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = state.lineWidth;
            }
            if (state.mode !== 'highlighter') {
                ctx.globalAlpha = 1;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (state.lineStyle === 'dashed') {
                ctx.setLineDash([8, 6]);
            } else if (state.lineStyle === 'dotted') {
                ctx.setLineDash([4, 6]);
            } else {
                ctx.setLineDash([]);
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  OBJECT HIT DETECTION (Images + Texts)
        // ═══════════════════════════════════════════════════════════════
        function getObjectAt(x, y) {
            const page = state.pages[state.currentPage];
            if (!page) return null;

            // Check texts (top layer)
            if (page.texts) {
                for (let i = page.texts.length - 1; i >= 0; i--) {
                    const t = page.texts[i];
                    const fs = t.fontSize || 28;
                    ctx.font = `${fs}px "${t.fontFamily || 'Segoe UI'}", sans-serif`;
                    const metrics = ctx.measureText(t.text);
                    const tw = metrics.width;
                    const th = fs * 1.2;
                    if (x >= t.x - 4 && x <= t.x + tw + 4 &&
                        y >= t.y - th + 4 && y <= t.y + 4) {
                        return { type: 'text', index: i };
                    }
                }
            }

            // Check images
            if (page.images) {
                for (let i = page.images.length - 1; i >= 0; i--) {
                    const img = page.images[i];
                    if (x >= img.x && x <= img.x + img.width &&
                        y >= img.y && y <= img.y + img.height) {
                        return { type: 'image', index: i };
                    }
                }
            }
            return null;
        }

        function getSelectedObject() {
            const page = state.pages[state.currentPage];
            if (!page) return null;
            if (state.selectedObjectType === 'image' && page.images && page.images[state.selectedObjectIndex]) {
                return { type: 'image', obj: page.images[state.selectedObjectIndex] };
            }
            if (state.selectedObjectType === 'text' && page.texts && page.texts[state.selectedObjectIndex]) {
                return { type: 'text', obj: page.texts[state.selectedObjectIndex] };
            }
            return null;
        }

        function deleteSelectedObject() {
            const page = state.pages[state.currentPage];
            if (!page) return;
            if (state.selectedObjectType === 'image' && page.images) {
                page.images.splice(state.selectedObjectIndex, 1);
                state.selectedObjectType = null;
                state.selectedObjectIndex = -1;
                renderAll();
                saveCurrentPageData();
            } else if (state.selectedObjectType === 'text' && page.texts) {
                page.texts.splice(state.selectedObjectIndex, 1);
                state.selectedObjectType = null;
                state.selectedObjectIndex = -1;
                renderAll();
                saveCurrentPageData();
            }
        }

        // Delete key to remove selected object
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (state.selectedObjectType !== null) {
                    e.preventDefault();
                    deleteSelectedObject();
                }
            }
        });

        // ═══════════════════════════════════════════════════════════════
        //  DRAWING EVENTS (with Move support for objects)
        // ═══════════════════════════════════════════════════════════════
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scale = state.zoom;
            return {
                x: (clientX - rect.left) / scale,
                y: (clientY - rect.top) / scale
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            const pos = getPos(e);
            state.isDrawing = true;
            state.startX = pos.x;
            state.startY = pos.y;

            // MOVE MODE: select or drag object
            if (state.mode === 'move') {
                const hit = getObjectAt(pos.x, pos.y);
                if (hit) {
                    state.selectedObjectType = hit.type;
                    state.selectedObjectIndex = hit.index;
                    state.isDraggingObject = true;
                    const obj = getSelectedObject();
                    if (obj) {
                        state.dragOffsetX = pos.x - obj.obj.x;
                        state.dragOffsetY = pos.y - obj.obj.y;
                        canvas.style.cursor = 'grabbing';
                    }
                    renderAll();
                    return;
                } else {
                    state.selectedObjectType = null;
                    state.selectedObjectIndex = -1;
                    state.isDraggingObject = false;
                    renderAll();
                    return;
                }
            }

            // PEN / ERASER / HIGHLIGHTER
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if (state.shape !== 'none') {
                state.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            } else {
                state.snapshot = null;
            }
        }

        function draw(e) {
            e.preventDefault();
            if (!state.isDrawing) return;
            const pos = getPos(e);

            // MOVE MODE: drag selected object
            if (state.mode === 'move' && state.isDraggingObject && state.selectedObjectType !== null) {
                const obj = getSelectedObject();
                if (obj) {
                    obj.obj.x = pos.x - state.dragOffsetX;
                    obj.obj.y = pos.y - state.dragOffsetY;
                    renderAll();
                    saveCurrentPageData();
                }
                return;
            }

            // Shape drawing
            if (state.shape !== 'none' && (state.mode === 'pen' || state.mode === 'highlighter')) {
                if (state.snapshot) {
                    ctx.putImageData(state.snapshot, 0, 0);
                }
                updateContext();
                ctx.beginPath();
                const x = state.startX,
                    y = state.startY;
                const w = pos.x - x,
                    h = pos.y - y;

                if (state.shape === 'line') {
                    ctx.moveTo(x, y);
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if (state.shape === 'rect') {
                    if (state.fillShape) {
                        ctx.fillRect(x, y, w, h);
                    } else {
                        ctx.strokeRect(x, y, w, h);
                    }
                } else if (state.shape === 'circle') {
                    const radius = Math.sqrt(w * w + h * h);
                    ctx.arc(x, y, radius, 0, 2 * Math.PI);
                    if (state.fillShape) {
                        ctx.fill();
                    } else {
                        ctx.stroke();
                    }
                }
                return;
            }

            // Freehand
            updateContext();
            if (state.mode === 'pen' || state.mode === 'eraser' || state.mode === 'highlighter') {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
        }

        function stopDrawing(e) {
            if (state.isDrawing) {
                state.isDrawing = false;
                if (state.mode === 'move') {
                    state.isDraggingObject = false;
                    canvas.style.cursor = 'grab';
                    renderAll();
                    return;
                }
                ctx.beginPath();
                ctx.setLineDash([]);
                saveHistory();
                renderAll();
            }
        }

        // ── Event Listeners ──
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault();
            startDrawing(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault();
            draw(e); });
        canvas.addEventListener('touchend', (e) => { e.preventDefault();
            stopDrawing(e); });

        // ── Zoom with scroll ──
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            let newZoom = Math.min(3, Math.max(0.3, state.zoom + delta));
            state.zoom = newZoom;
            applyZoomAndPan();
        }, { passive: false });

        // ── Pan with middle-click ──
        let isPanning = false,
            panStartX = 0,
            panStartY = 0;
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 1) {
                e.preventDefault();
                isPanning = true;
                panStartX = e.clientX;
                panStartY = e.clientY;
                canvas.style.cursor = 'grab';
            }
        });
        document.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - panStartX;
                const dy = e.clientY - panStartY;
                state.panX += dx;
                state.panY += dy;
                panStartX = e.clientX;
                panStartY = e.clientY;
                applyZoomAndPan();
            }
        });
        document.addEventListener('mouseup', () => {
            if (isPanning) {
                isPanning = false;
                canvas.style.cursor = state.mode === 'move' ? 'grab' : 'crosshair';
            }
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // ═══════════════════════════════════════════════════════════════
        //  IMAGE HANDLING (Gallery)
        // ═══════════════════════════════════════════════════════════════
        function loadGalleryImage(e) {
            const files = e.target.files;
            if (!files.length) return;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const page = state.pages[state.currentPage];
                        if (!page) return;
                        if (!page.images) page.images = [];
                        let maxDim = Math.min(canvas.width, canvas.height) * 0.35;
                        let scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                        let w = img.width * scale;
                        let h = img.height * scale;
                        let x = (canvas.width - w) / 2 + (Math.random() * 60 - 30);
                        let y = (canvas.height - h) / 2 + (Math.random() * 60 - 30);
                        page.images.push({
                            x: x,
                            y: y,
                            width: w,
                            height: h,
                            imgElement: img
                        });
                        renderAll();
                        saveCurrentPageData();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        }

        // ═══════════════════════════════════════════════════════════════
        //  OBJECT SIZE (for selected image or text)
        // ═══════════════════════════════════════════════════════════════
        function setObjectSize(val) {
            state.objectScale = parseInt(val) / 100;
            objectSizeDisplay.textContent = val + '%';

            const page = state.pages[state.currentPage];
            if (!page) return;

            // Resize selected image
            if (state.selectedObjectType === 'image') {
                const imgObj = page.images && page.images[state.selectedObjectIndex];
                if (imgObj && imgObj.imgElement) {
                    const origW = imgObj.imgElement.naturalWidth || imgObj.imgElement.width;
                    const origH = imgObj.imgElement.naturalHeight || imgObj.imgElement.height;
                    const baseSize = Math.min(canvas.width, canvas.height) * 0.3;
                    const newW = origW * (baseSize / Math.max(origW, origH)) * state.objectScale;
                    const newH = origH * (baseSize / Math.max(origW, origH)) * state.objectScale;
                    const cx = imgObj.x + imgObj.width / 2;
                    const cy = imgObj.y + imgObj.height / 2;
                    imgObj.width = newW;
                    imgObj.height = newH;
                    imgObj.x = cx - newW / 2;
                    imgObj.y = cy - newH / 2;
                    renderAll();
                    saveCurrentPageData();
                }
            }

            // Resize selected text (font size)
            if (state.selectedObjectType === 'text') {
                const txt = page.texts && page.texts[state.selectedObjectIndex];
                if (txt) {
                    const baseSize = 28;
                    txt.fontSize = Math.max(10, baseSize * state.objectScale);
                    renderAll();
                    saveCurrentPageData();
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  VIRTUAL KEYBOARD — inserts text as movable object
        // ═══════════════════════════════════════════════════════════════
        function toggleKeyboard() {
            const kb = keyboardContainer;
            if (kb.classList.contains('open')) {
                kb.classList.remove('open');
            } else {
                kb.classList.add('open');
                keyboardTextDisplay.textContent = state.keyboardText || '📝 टाइप करें...';
            }
        }

        function closeKeyboard() {
            keyboardContainer.classList.remove('open');
        }

        function keyPress(char) {
            state.keyboardText += char;
            keyboardTextDisplay.textContent = state.keyboardText || '📝 टाइप करें...';
        }

        function keyBackspace() {
            state.keyboardText = state.keyboardText.slice(0, -1);
            keyboardTextDisplay.textContent = state.keyboardText || '📝 टाइप करें...';
        }

        function keyClear() {
            state.keyboardText = '';
            keyboardTextDisplay.textContent = '📝 टाइप करें...';
        }

        function insertKeyboardText() {
            if (state.keyboardText.trim() === '') {
                alert('कृपया कुछ टाइप करें!');
                return;
            }
            const page = state.pages[state.currentPage];
            if (!page) return;
            if (!page.texts) page.texts = [];

            const fs = Math.max(20, state.lineWidth * 5);
            const centerX = canvas.width / 2 - 40;
            const centerY = canvas.height / 2 + fs / 3;

            page.texts.push({
                x: centerX,
                y: centerY,
                text: state.keyboardText,
                fontSize: fs,
                color: state.color,
                fontFamily: 'Segoe UI'
            });

            renderAll();
            saveCurrentPageData();
            state.keyboardText = '';
            keyboardTextDisplay.textContent = '📝 टाइप करें...';
            closeKeyboard();

            // Auto-select the new text so user can move it immediately
            state.selectedObjectType = 'text';
            state.selectedObjectIndex = page.texts.length - 1;
            // Switch to move mode
            setMode('move');
        }

        // Keyboard shortcuts for the virtual keyboard
        document.addEventListener('keydown', (e) => {
            if (keyboardContainer.classList.contains('open')) {
                if (e.key === 'Enter') { e.preventDefault();
                    insertKeyboardText(); }
                if (e.key === 'Backspace') { e.preventDefault();
                    keyBackspace(); }
                if (e.key === 'Escape') { e.preventDefault();
                    closeKeyboard(); }
                if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                    keyPress(e.key);
                }
            }
        });

        // ═══════════════════════════════════════════════════════════════
        //  BACKGROUND
        // ═══════════════════════════════════════════════════════════════
        function changeBackground(bgClass) {
            container.className = bgClass;
            if (bgClass === 'bg-blackboard' && state.color === '#000000') {
                colorPicker.value = '#ffffff';
                changeColor('#ffffff');
            }
            renderAll();
        }

        // ═══════════════════════════════════════════════════════════════
        //  CLEAR & DOWNLOAD
        // ═══════════════════════════════════════════════════════════════
        function clearCanvas() {
            if (!confirm('क्या आप इस पेज को साफ़ करना चाहते हैं? (इमेज और टेक्स्ट भी हटेंगे)')) return;
            const page = state.pages[state.currentPage];
            if (page) {
                page.images = [];
                page.texts = [];
                page.drawingData = null;
            }
            ctx.fillStyle = getBgColor();
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (page) {
                page.drawingData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
            state.selectedObjectType = null;
            state.selectedObjectIndex = -1;
            saveHistory();
            renderAll();
        }

        function downloadBoard() {
            const link = document.createElement('a');
            link.download = `digital_board_page_${state.currentPage+1}.png`;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = getBgColor();
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            const page = state.pages[state.currentPage];
            if (page) {
                if (page.drawingData) {
                    tCtx.putImageData(page.drawingData, 0, 0);
                }
                if (page.images) {
                    page.images.forEach(img => {
                        if (img.imgElement) {
                            tCtx.drawImage(img.imgElement, img.x, img.y, img.width, img.height);
                        }
                    });
                }
                if (page.texts) {
                    page.texts.forEach(t => {
                        tCtx.font = `${t.fontSize || 28}px "${t.fontFamily || 'Segoe UI'}", sans-serif`;
                        tCtx.fillStyle = t.color || '#000000';
                        tCtx.fillText(t.text, t.x, t.y);
                    });
                }
            }
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }

        function exportPDF() {
            window.print();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  TIMER
        // ═══════════════════════════════════════════════════════════════
        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
                btn.textContent = 'शुरू';
            } else {
                state.timerInterval = setInterval(() => {
                    state.timerSeconds++;
                    const mins = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
                    const secs = String(state.timerSeconds % 60).padStart(2, '0');
                    document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
                }, 1000);
                btn.textContent = 'रोकें';
            }
        }

        function resetTimer() {
            if (state.timerInterval) { clearInterval(state.timerInterval);
                state.timerInterval = null; }
            state.timerSeconds = 0;
            document.getElementById('timerDisplay').textContent = '00:00';
            document.getElementById('timerBtn').textContent = 'शुरू';
        }

        // ═══════════════════════════════════════════════════════════════
        //  STICKY NOTES
        // ═══════════════════════════════════════════════════════════════
        function addStickyNote() {
            const template = document.getElementById('noteTemplate');
            const clone = template.cloneNode(true);
            clone.style.display = 'block';
            clone.id = '';
            const rect = container.getBoundingClientRect();
            const left = 40 + Math.random() * (rect.width - 300);
            const top = 40 + Math.random() * (rect.height - 200);
            clone.style.left = left + 'px';
            clone.style.top = top + 'px';
            let isDragging = false,
                dragOffX = 0,
                dragOffY = 0;
            const noteEl = clone.querySelector('.sticky-note') || clone;
            noteEl.addEventListener('mousedown', (e) => {
                if (e.target.closest('.note-close')) return;
                isDragging = true;
                const rect2 = noteEl.getBoundingClientRect();
                dragOffX = e.clientX - rect2.left;
                dragOffY = e.clientY - rect2.top;
                noteEl.style.cursor = 'grabbing';
                noteEl.style.zIndex = 30;
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const containerRect = container.getBoundingClientRect();
                let x = e.clientX - containerRect.left - dragOffX;
                let y = e.clientY - containerRect.top - dragOffY;
                x = Math.max(0, Math.min(containerRect.width - 160, x));
                y = Math.max(0, Math.min(containerRect.height - 100, y));
                noteEl.style.left = x + 'px';
                noteEl.style.top = y + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    noteEl.style.cursor = 'grab';
                    noteEl.style.zIndex = 20;
                }
            });
            container.appendChild(clone);
            const textDiv = clone.querySelector('.note-text');
            if (textDiv) setTimeout(() => textDiv.focus(), 100);
        }

        // Add sticky note button
        const stickyBtn = document.createElement('button');
        stickyBtn.textContent = '📌 नोट';
        stickyBtn.title = 'स्टिकी नोट जोड़ें';
        stickyBtn.onclick = addStickyNote;
        stickyBtn.style.background = '#f59e0b';
        document.querySelector('.toolbar-group:nth-child(4)')?.appendChild(stickyBtn);

        // ═══════════════════════════════════════════════════════════════
        //  INITIALIZATION
        // ═══════════════════════════════════════════════════════════════
        function init() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            state.pages = [];
            state.currentPage = 0;
            ctx.fillStyle = getBgColor();
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            state.pages.push({
                drawingData: ctx.getImageData(0, 0, canvas.width, canvas.height),
                images: [],
                texts: []
            });
            state.history = [];
            state.historyIndex = -1;
            saveHistory();
            updatePageUI();
            applyZoomAndPan();
            updateContext();
            colorPicker.value = '#000000';
            setMode('pen');
            objectSizeSlider.value = '100';
            objectSizeDisplay.textContent = '100%';
            console.log('✅ डिजिटल बोर्ड v3.1 लोड हो गया!');
            console.log('📌 कीपैड से टाइप करें → टेक्स्ट मूव करें');
            console.log('🖼️ गैलरी से फोटो → मूव करें');
            console.log('↕️ मूव मोड में ऑब्जेक्ट को खींचें');
            console.log('⌨️ Delete key से सेलेक्टेड ऑब्जेक्ट हटाएं');
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                saveCurrentPageData();
                resizeCanvas();
                renderAll();
                applyZoomAndPan();
            }, 200);
        });

        init();
    </script>
</body>
</html>
