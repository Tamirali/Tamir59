<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏗️ कांट्रैक्टर वर्कर & साइट ट्रैकर</title>
    <style>
        :root {
            --primary: #f39c12;
            --primary-dark: #d35400;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #2c3e50;
            --border: #e2e8f0;
            --green: #27ae60;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        header h1 {
            font-size: 20px;
            color: var(--primary-dark);
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            background: #eee;
            padding: 4px;
            border-radius: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            border-radius: 6px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        input, select, button {
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-green { background: var(--green); color: white; border: none; }
        .btn-red { background: var(--red); color: white; border: none; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .summary-box {
            display: flex;
            justify-content: space-between;
            background: #fff3cd;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏗️ कांट्रैक्टर & साइट मैनेजमेंट</h1>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('workers')">👷 मजदूर लिस्ट</button>
        <button class="tab-btn" onclick="switchTab('attendance')">📋 हाजिरी & पेमेंट</button>
        <button class="tab-btn" onclick="switchTab('materials')">🧱 सामान (Material)</button>
    </div>

    <!-- TAB 1: WORKER MANAGEMENT -->
    <div id="tab-workers" class="tab-content active">
        <div class="card">
            <h3>नया मजदूर जोड़ें</h3>
            <div class="form-group" style="margin-top:8px;">
                <input type="text" id="workerName" placeholder="मजदूर का नाम">
                <input type="number" id="workerDailyWage" placeholder="दैनिक दिहाड़ी (₹)">
                <button class="btn-primary" onclick="addWorker()">+ मजदूर जोड़ें</button>
            </div>
        </div>

        <div class="card">
            <h3>सभी मजदूर</h3>
            <table>
                <thead>
                    <tr>
                        <th>नाम</th>
                        <th>दिहाड़ी</th>
                        <th>हटाएं</th>
                    </tr>
                </thead>
                <tbody id="workerTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: ATTENDANCE & PAYMENT -->
    <div id="tab-attendance" class="tab-content">
        <div class="card">
            <h3>दैनिक हाजिरी दर्ज करें</h3>
            <div class="form-group" style="margin-top:8px;">
                <input type="date" id="attDate">
                <select id="attWorkerSelect"></select>
                <select id="attStatus">
                    <option value="1">पूरा दिन (Full Day)</option>
                    <option value="0.5">आधा दिन (Half Day)</option>
                    <option value="0">अनुपस्थित (Absent)</option>
                </select>
                <button class="btn-green" onclick="markAttendance()">हाजिरी दर्ज करें</button>
            </div>
        </div>

        <div class="card">
            <h3>एडवांस / पेमेंट एंट्री</h3>
            <div class="form-group" style="margin-top:8px;">
                <select id="payWorkerSelect"></select>
                <input type="number" id="payAmount" placeholder="दिया गया भुगतान (₹)">
                <button class="btn-primary" onclick="addPayment()">भुगतान दर्ज करें</button>
            </div>
        </div>

        <div class="card">
            <h3>हाजिरी & हिसाब-किताब समरी</h3>
            <div id="attendanceSummary"></div>
        </div>
    </div>

    <!-- TAB 3: MATERIAL ENTRY -->
    <div id="tab-materials" class="tab-content">
        <div class="card">
            <h3>साइट सामान की एंट्री (Material Entry)</h3>
            <div class="form-group" style="margin-top:8px;">
                <input type="date" id="matDate">
                <input type="text" id="matName" placeholder="सामान का नाम (जैसे: सीमेंट, ईंट)">
                <input type="text" id="matQty" placeholder="मात्रा (जैसे: 50 बोरी)">
                <input type="number" id="matCost" placeholder="कुल लागत (₹)">
                <button class="btn-primary" onclick="addMaterial()">सामान दर्ज करें</button>
            </div>
        </div>

        <div class="card">
            <h3>साइट पर आए सामान का रिकॉर्ड</h3>
            <div class="summary-box">
                <span>कुल सामान खर्च:</span>
                <span id="totalMatCost">₹ 0</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>दिनांक</th>
                        <th>सामान</th>
                        <th>मात्रा</th>
                        <th>लागत</th>
                    </tr>
                </thead>
                <tbody id="materialTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // LocalStorage Keys
    let workers = JSON.parse(localStorage.getItem('site_workers')) || [];
    let attendance = JSON.parse(localStorage.getItem('site_attendance')) || [];
    let payments = JSON.parse(localStorage.getItem('site_payments')) || [];
    let materials = JSON.parse(localStorage.getItem('site_materials')) || [];

    // Set Default Dates to Today
    document.getElementById('attDate').valueAsDate = new Date();
    document.getElementById('matDate').valueAsDate = new Date();

    function saveData() {
        localStorage.setItem('site_workers', JSON.stringify(workers));
        localStorage.setItem('site_attendance', JSON.stringify(attendance));
        localStorage.setItem('site_payments', JSON.stringify(payments));
        localStorage.setItem('site_materials', JSON.stringify(materials));
        renderAll();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
    }

    // WORKERS LOGIC
    function addWorker() {
        const name = document.getElementById('workerName').value.trim();
        const wage = parseFloat(document.getElementById('workerDailyWage').value);

        if (!name || isNaN(wage)) return alert('कृपया नाम और दिहाड़ी दर्ज करें!');

        workers.push({ id: Date.now(), name, wage });
        document.getElementById('workerName').value = '';
        document.getElementById('workerDailyWage').value = '';
        saveData();
    }

    function deleteWorker(id) {
        if(confirm('क्या आप इस मजदूर को हटाना चाहते हैं?')) {
            workers = workers.filter(w => w.id !== id);
            saveData();
        }
    }

    // ATTENDANCE LOGIC
    function markAttendance() {
        const date = document.getElementById('attDate').value;
        const workerId = parseInt(document.getElementById('attWorkerSelect').value);
        const status = parseFloat(document.getElementById('attStatus').value);

        if (!workerId || !date) return alert('मजदूर और तारीख चुनें!');

        attendance.push({ id: Date.now(), date, workerId, status });
        alert('हाजिरी लग गई!');
        saveData();
    }

    // PAYMENT LOGIC
    function addPayment() {
        const workerId = parseInt(document.getElementById('payWorkerSelect').value);
        const amount = parseFloat(document.getElementById('payAmount').value);

        if (!workerId || isNaN(amount)) return alert('मजदूर और सही राशि दर्ज करें!');

        payments.push({ id: Date.now(), date: new Date().toISOString().split('T')[0], workerId, amount });
        document.getElementById('payAmount').value = '';
        alert('भुगतान दर्ज हुआ!');
        saveData();
    }

    // MATERIAL LOGIC
    function addMaterial() {
        const date = document.getElementById('matDate').value;
        const name = document.getElementById('matName').value.trim();
        const qty = document.getElementById('matQty').value.trim();
        const cost = parseFloat(document.getElementById('matCost').value) || 0;

        if (!name || !qty) return alert('सामान और मात्रा दर्ज करें!');

        materials.push({ id: Date.now(), date, name, qty, cost });
        document.getElementById('matName').value = '';
        document.getElementById('matQty').value = '';
        document.getElementById('matCost').value = '';
        saveData();
    }

    // RENDER FUNCTIONS
    function renderAll() {
        // 1. Render Worker Tables & Dropdowns
        const wBody = document.getElementById('workerTableBody');
        const attSelect = document.getElementById('attWorkerSelect');
        const paySelect = document.getElementById('payWorkerSelect');

        wBody.innerHTML = '';
        attSelect.innerHTML = '<option value="">मजदूर चुनें</option>';
        paySelect.innerHTML = '<option value="">मजदूर चुनें</option>';

        workers.forEach(w => {
            wBody.innerHTML += `
                <tr>
                    <td>${w.name}</td>
                    <td>₹ ${w.wage}</td>
                    <td><button class="btn-red" style="padding:4px 8px;" onclick="deleteWorker(${w.id})">X</button></td>
                </tr>`;
            
            attSelect.innerHTML += `<option value="${w.id}">${w.name}</option>`;
            paySelect.innerHTML += `<option value="${w.id}">${w.name}</option>`;
        });

        // 2. Render Attendance & Balance Summary
        const summaryDiv = document.getElementById('attendanceSummary');
        summaryDiv.innerHTML = '';

        workers.forEach(w => {
            // Calculate total earned
            const wAtt = attendance.filter(a => a.workerId === w.id);
            const totalDays = wAtt.reduce((sum, a) => sum + a.status, 0);
            const totalEarned = totalDays * w.wage;

            // Calculate total paid
            const wPay = payments.filter(p => p.workerId === w.id);
            const totalPaid = wPay.reduce((sum, p) => sum + p.amount, 0);

            const balance = totalEarned - totalPaid;

            summaryDiv.innerHTML += `
                <div style="border-bottom:1px solid #eee; padding:8px 0;">
                    <strong>${w.name}</strong><br>
                    <small>कुल दिन: ${totalDays} | कुल कमाई: ₹${totalEarned} | दिया गया: ₹${totalPaid}</small><br>
                    <span style="color:${balance >= 0 ? 'red' : 'green'}; font-weight:bold;">
                        ${balance >= 0 ? 'बाकी भुगतान करना है: ₹' + balance : 'एडवांस दिया है: ₹' + Math.abs(balance)}
                    </span>
                </div>`;
        });

        // 3. Render Materials
        const mBody = document.getElementById('materialTableBody');
        mBody.innerHTML = '';
        let matTotal = 0;

        materials.forEach(m => {
            matTotal += m.cost;
            mBody.innerHTML += `
                <tr>
                    <td>${m.date}</td>
                    <td>${m.name}</td>
                    <td>${m.qty}</td>
                    <td>₹ ${m.cost}</td>
                </tr>`;
        });
        document.getElementById('totalMatCost').innerText = '₹ ' + matTotal;
    }

    // Initial Load
    renderAll();
</script>

</body>
</html>
