<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>इमेज रिसाइज़र & कनवर्टर</title>
  <style>
    body { font-family: sans-serif; background: #fdf2e9; padding: 15px; margin: 0; }
    .card { background: white; max-width: 450px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #d35400; text-align: center; }
    .desc { font-size: 13px; color: #555; background: #fae5d3; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    input, select, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #e67e22; color: white; border: none; font-weight: bold; cursor: pointer; }
    #preview { max-width: 100%; margin-top: 15px; display: none; border-radius: 6px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🖼️ इमेज रिसाइज़र टूल</h2>
  <div class="desc">
    <b>विषय:</b> ऑनलाइन फ़ॉर्म भरने के लिए फोटो का साइज़ (Width/Height) छोटा करना और फ़ॉर्मेट बदलना।
  </div>

  <input type="file" id="img-file" accept="image/*" onchange="loadFile(event)">
  
  <label style="font-size: 13px;">चौड़ाई (Width in px):</label>
  <input type="number" id="img-w" value="300">

  <label style="font-size: 13px;">ऊँचाई (Height in px):</label>
  <input type="number" id="img-h" value="300">

  <button onclick="resizeImage()">फोटो रिसाइज़ करें</button>

  <img id="preview" alt="Resized Image">
  <a id="download-btn" style="display:none; text-align:center; display:block; margin-top:10px; color:#e67e22; font-weight:bold;" download="resized.jpg">📥 फोटो डाउनलोड करें</a>
</div>

<script>
  let originalImage = new Image();

  function loadFile(e) {
    let reader = new FileReader();
    reader.onload = function() {
      originalImage.src = reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
  }

  function resizeImage() {
    if(!originalImage.src) { alert('पहले कोई फोटो चुनें!'); return; }
    let canvas = document.createElement('canvas');
    let w = document.getElementById('img-w').value;
    let h = document.getElementById('img-h').value;
    canvas.width = w;
    canvas.height = h;

    let ctx = canvas.getContext('2d');
    ctx.drawImage(originalImage, 0, 0, w, h);

    let dataUrl = canvas.toDataURL('image/jpeg');
    let imgPreview = document.getElementById('preview');
    imgPreview.src = dataUrl;
    imgPreview.style.display = 'block';

    let dl = document.getElementById('download-btn');
    dl.href = dataUrl;
    dl.style.display = 'block';
  }
</script>

</body>
</html>
