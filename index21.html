<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 प्रो फोटो कैरेक्टर एनिमेटर + वीडियो एक्सपोर्ट</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #0e0f17; color: #e0e0e0; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #00d2ff; margin: 0 0 4px 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .subtitle { color: #777; font-size: 13px; margin: 0 0 18px 0; }
        .main-container { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 1150px; width: 100%; }
        .panel { background: #1a1b2a; border-radius: 14px; padding: 16px; flex: 1 1 280px; min-width: 250px; max-width: 380px; border: 1px solid #2a2c40; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); }
        .panel h3 { margin: 0 0 12px 0; color: #00d2ff; font-size: 15px; border-bottom: 1px solid #2a2c40; padding-bottom: 8px; display: flex; justify-content: space-between; }
        .crop-wrapper { position: relative; background: #0a0b12; border-radius: 8px; overflow: hidden; border: 1px solid #2a2c40; touch-action: none; height: 260px; }
        #cropCanvas { display: block; width: 100%; height: 100%; background: #0a0b12; cursor: crosshair; }
        .zoom-controls { display: flex; gap: 6px; margin-bottom: 8px; justify-content: center; }
        .btn { background: #00d2ff; color: #0a0b12; border: none; padding: 8px 12px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.15s; font-size: 13px; }
        .btn:hover { background: #00b8e6; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-secondary { background: #2a2c40; color: #ccc; }
        .btn-success { background: #2ecc71; color: #0a0b12; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-warning { background: #f39c12; color: #0a0b12; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .workspace { position: relative; width: 100%; aspect-ratio: 320 / 380; background: #0a0b12; border-radius: 10px; overflow: hidden; border: 1px solid #2a2c40; touch-action: none; background-image: radial-gradient(circle, #1a1b2a 1px, transparent 1px); background-size: 20px 20px; }
        .workspace .part { position: absolute; cursor: grab; user-select: none; touch-action: none; }
        .workspace .part.selected { border: 2px solid #00d2ff; filter: drop-shadow(0 0 12px #00d2ffaa); z-index: 999 !important; }
        .control-group { margin-bottom: 10px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 2px; }
        .control-group input[type="range"] { width: 100%; }
        .flex-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .part-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; min-height: 28px; }
        .part-list .tag { background: #1a1b2a; padding: 2px 10px; border-radius: 20px; font-size: 11px; color: #aaa; cursor: pointer; border: 1px solid #2a2c40; }
        .part-list .tag.active { border-color: #00d2ff; color: #00d2ff; }
    </style>
</head>
<body>

    <h2>🎭 प्रो कैरेक्टर एनिमेटर + वीडियो स्टूडियो</h2>
    <p class="subtitle">📸 फोटो अपलोड करें → 🔍 ज़ूम करके काटें → 🎬 एनिमेट करें → 🎥 वीडियो डाउनलोड करें</p>

    <div class="main-container">

        <!-- Panel 1: Upload & Crop (Zoom Feature Included) -->
        <div class="panel">
            <h3>📸 1. ज़ूम एवं क्रॉप</h3>
            <input type="file" id="imageLoader" accept="image/*" style="width:100%;margin-bottom:8px;color:#aaa;font-size:12px;">
            
            <!-- Zoom Buttons -->
            <div class="zoom-controls">
                <button class="btn btn-secondary btn-sm" id="zoomInBtn">🔍 ज़ूम इन (+)</button>
                <button class="btn btn-secondary btn-sm" id="zoomOutBtn">🔍 ज़ूम आउट (-)</button>
                <button class="btn btn-secondary btn-sm" id="resetZoomBtn">↺ रीसेट ज़ूम</button>
            </div>

            <div class="crop-wrapper">
                <canvas id="cropCanvas" width="620" height="400"></canvas>
            </div>
            <p style="font-size:11px;color:#777;text-align:center;margin:4px 0;">उंगली/माउस से खींचकर बारीक हिस्सा चुनें</p>
            <div class="flex-row">
                <button class="btn" id="cropBtn" style="flex:1;">➕ अंग जोड़ें</button>
                <button class="btn btn-secondary btn-sm" id="clearCropBtn">↺ रीसेट</button>
            </div>
        </div>

        <!-- Panel 2: Workspace -->
        <div class="panel">
            <h3>🎬 2. वर्कस्पेस <span id="partCount">0</span></h3>
            <div class="workspace" id="workspace"></div>
            <div class="part-list" id="partList"></div>
            <div class="flex-row">
                <button class="btn btn-secondary btn-sm" id="layerUpBtn">⬆ ऊपर</button>
                <button class="btn btn-secondary btn-sm" id="layerDownBtn">⬇ नीचे</button>
            </div>
        </div>

        <!-- Panel 3: Controls & Video Recording -->
        <div class="panel">
            <h3>🎛️ 3. कमान & वीडियो एक्सपोर्ट</h3>

            <div class="control-group">
                <label>रोटेशन (घुमाव) <span id="rotVal">0°</span></label>
                <input type="range" id="rotateSlider" min="-180" max="180" value="0" disabled>
            </div>

            <div class="control-group">
                <label>आकार (Scale) <span id="scaleVal">100%</span></label>
                <input type="range" id="scaleSlider" min="20" max="200" value="100" disabled>
            </div>

            <div class="control-group">
                <label>घुमाव जोड़ (Pivot)</label>
                <select id="pivotSelect" style="width:100%;background:#0a0b12;color:#eee;padding:4px;border-radius:4px;" disabled>
                    <option value="top center">ऊपर (कंधा/घुटना)</option>
                    <option value="center" selected>मध्य (Center)</option>
                    <option value="bottom center">नीचे (पंजा/पैर)</option>
                </select>
            </div>

            <div class="control-group" style="margin-top:10px;">
                <label>एनिमेट एक्शन</label>
                <div class="flex-row">
                    <select id="actionTypeSelect" style="flex:1;background:#0a0b12;color:#eee;padding:4px;" disabled>
                        <option value="wave">🌊 वेव (हिलना)</option>
                        <option value="shake">🌀 शेक (कंपना)</option>
                        <option value="spin">🔄 स्पिन (घूमना)</option>
                    </select>
                    <button class="btn btn-success" id="autoAnimateBtn" disabled>▶ चलाएँ</button>
                </div>
            </div>

            <hr style="border-color:#2a2c40;margin:15px 0;">

            <!-- Video Recording Controls -->
            <div style="text-align:center;">
                <h4 style="margin:0 0 8px 0;color:#00d2ff;font-size:13px;">🎥 एनिमेशन वीडियो सेव करें</h4>
                <div class="flex-row">
                    <button class="btn btn-danger" id="recordVideoBtn" style="flex:1;">🔴 रिकॉर्डिंग शुरू करें</button>
                </div>
                <p id="recordStatus" style="font-size:11px;color:#aaa;margin-top:5px;"></p>
            </div>
        </div>

    </div>

    <script>
        const state = {
            image: null,
            crop: { x: 0, y: 0, w: 0, h: 0 },
            isSelecting: false,
            startX: 0, startY: 0,
            zoomScale: 1,
            parts: [],
            nextId: 0,
            selectedId: null,
            autoInterval: null,
            autoRunning: false,
            mediaRecorder: null,
            recordedChunks: []
        };

        const cropCanvas = document.getElementById('cropCanvas');
        const ctx = cropCanvas.getContext('2d');
        const workspace = document.getElementById('workspace');

        // --- ZOOM LOGIC ---
        document.getElementById('zoomInBtn').onclick = () => { state.zoomScale *= 1.25; drawCropCanvas(); };
        document.getElementById('zoomOutBtn').onclick = () => { state.zoomScale = Math.max(0.5, state.zoomScale / 1.25); drawCropCanvas(); };
        document.getElementById('resetZoomBtn').onclick = () => { state.zoomScale = 1; drawCropCanvas(); };

        // --- IMAGE LOAD ---
        document.getElementById('imageLoader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    state.image = img;
                    state.zoomScale = 1;
                    state.crop = { x: 0, y: 0, w: 0, h: 0 };
                    drawCropCanvas();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function drawCropCanvas() {
            ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
            if (!state.image) return;

            ctx.save();
            ctx.scale(state.zoomScale, state.zoomScale);
            ctx.drawImage(state.image, 0, 0, cropCanvas.width / state.zoomScale, cropCanvas.height / state.zoomScale);

            const cr = state.crop;
            if (cr.w > 2 && cr.h > 2) {
                ctx.strokeStyle = '#00d2ff';
                ctx.lineWidth = 2 / state.zoomScale;
                ctx.strokeRect(cr.x, cr.y, cr.w, cr.h);
            }
            ctx.restore();
        }

        // --- CROP MOUSE / TOUCH EVENTS ---
        function getCanvasCoords(e) {
            const rect = cropCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) / state.zoomScale,
                y: (clientY - rect.top) / state.zoomScale
            };
        }

        cropCanvas.addEventListener('mousedown', (e) => {
            if (!state.image) return;
            state.isSelecting = true;
            const p = getCanvasCoords(e);
            state.startX = p.x; state.startY = p.y;
            state.crop = { x: p.x, y: p.y, w: 0, h: 0 };
        });

        cropCanvas.addEventListener('mousemove', (e) => {
            if (!state.isSelecting || !state.image) return;
            const p = getCanvasCoords(e);
            state.crop = {
                x: Math.min(state.startX, p.x),
                y: Math.min(state.startY, p.y),
                w: Math.abs(p.x - state.startX),
                h: Math.abs(p.y - state.startY)
            };
            drawCropCanvas();
        });

        cropCanvas.addEventListener('mouseup', () => state.isSelecting = false);

        // --- CROP BUTTON ---
        document.getElementById('cropBtn').onclick = () => {
            const cr = state.crop;
            if (!state.image || cr.w < 5 || cr.h < 5) {
                alert('कृपया फोटो पर ज़ूम करके कोई हिस्सा सेलेक्ट करें!');
                return;
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cr.w * state.zoomScale;
            tempCanvas.height = cr.h * state.zoomScale;
            const tCtx = tempCanvas.getContext('2d');

            tCtx.drawImage(
                state.image, 
                cr.x * (state.image.width / (cropCanvas.width / state.zoomScale)), 
                cr.y * (state.image.height / (cropCanvas.height / state.zoomScale)), 
                cr.w * (state.image.width / (cropCanvas.width / state.zoomScale)), 
                cr.h * (state.image.height / (cropCanvas.height / state.zoomScale)), 
                0, 0, tempCanvas.width, tempCanvas.height
            );

            const imgEl = new Image();
            imgEl.src = tempCanvas.toDataURL();
            imgEl.onload = () => {
                const part = {
                    id: state.nextId++,
                    img: imgEl,
                    x: 50, y: 50,
                    rotation: 0, scale: 1, origin: 'top center',
                    width: tempCanvas.width / 2, height: tempCanvas.height / 2,
                    zIndex: state.parts.length
                };
                createPartElement(part);
                state.parts.push(part);
                selectPart(part.id);
            };
        };

        function createPartElement(part) {
            const el = document.createElement('img');
            el.src = part.img.src;
            el.className = 'part';
            el.style.width = part.width + 'px';
            el.style.left = part.x + 'px';
            el.style.top = part.y + 'px';
            
            el.onmousedown = (e) => { e.stopPropagation(); selectPart(part.id); startDrag(e, part); };
            workspace.appendChild(el);
            part.element = el;
            applyTransform(part);
        }

        function applyTransform(part) {
            if (!part.element) return;
            part.element.style.transform = `translate(${part.x}px, ${part.y}px) rotate(${part.rotation}deg) scale(${part.scale})`;
            part.element.style.transformOrigin = part.origin;
        }

        function selectPart(id) {
            document.querySelectorAll('.workspace .part').forEach(p => p.classList.remove('selected'));
            state.selectedId = id;
            const part = state.parts.find(p => p.id === id);
            if (part && part.element) {
                part.element.classList.add('selected');
                document.getElementById('rotateSlider').disabled = false;
                document.getElementById('scaleSlider').disabled = false;
                document.getElementById('pivotSelect').disabled = false;
                document.getElementById('autoAnimateBtn').disabled = false;
                document.getElementById('actionTypeSelect').disabled = false;
            }
        }

        // --- DRAG LOGIC ---
        function startDrag(e, part) {
            const startX = e.clientX - part.x;
            const startY = e.clientY - part.y;
            
            function move(ev) {
                part.x = ev.clientX - startX;
                part.y = ev.clientY - startY;
                applyTransform(part);
            }
            function stop() {
                window.removeEventListener('mousemove', move);
                window.removeEventListener('mouseup', stop);
            }
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', stop);
        }

        // --- SLIDERS ---
        document.getElementById('rotateSlider').oninput = (e) => {
            const part = state.parts.find(p => p.id === state.selectedId);
            if (part) { part.rotation = e.target.value; applyTransform(part); document.getElementById('rotVal').textContent = part.rotation + '°'; }
        };

        document.getElementById('pivotSelect').onchange = (e) => {
            const part = state.parts.find(p => p.id === state.selectedId);
            if (part) { part.origin = e.target.value; applyTransform(part); }
        };

        // --- AUTO ANIMATION ---
        document.getElementById('autoAnimateBtn').onclick = () => {
            const part = state.parts.find(p => p.id === state.selectedId);
            if (!part) return;

            if (state.autoRunning) {
                clearInterval(state.autoInterval);
                state.autoRunning = false;
                document.getElementById('autoAnimateBtn').textContent = '▶ चलाएँ';
            } else {
                state.autoRunning = true;
                document.getElementById('autoAnimateBtn').textContent = '⏹ रोकें';
                let dir = 1, angle = 0;
                state.autoInterval = setInterval(() => {
                    angle += dir * 4;
                    if (angle > 30 || angle < -30) dir *= -1;
                    part.rotation = angle;
                    applyTransform(part);
                }, 30);
            }
        };

        // --- VIDEO RECORDING (WORKSPACE TO VIDEO) ---
        const recordBtn = document.getElementById('recordVideoBtn');
        const recordStatus = document.getElementById('recordStatus');

        recordBtn.onclick = () => {
            if (state.mediaRecorder && state.mediaRecorder.state === "recording") {
                state.mediaRecorder.stop();
                recordBtn.textContent = "🔴 रिकॉर्डिंग शुरू करें";
                recordBtn.className = "btn btn-danger";
                recordStatus.textContent = "वीडियो प्रोसेस हो रहा है...";
            } else {
                startVideoRecording();
            }
        };

        function startVideoRecording() {
            // HTML Workspace को Canvas पर रेंडर करना रिकॉर्डिंग के लिए
            const recCanvas = document.createElement('canvas');
            recCanvas.width = workspace.clientWidth;
            recCanvas.height = workspace.clientHeight;
            const rCtx = recCanvas.getContext('2d');

            const stream = recCanvas.captureStream(30); // 30 FPS
            state.recordedChunks = [];
            state.mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            state.mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) state.recordedChunks.push(e.data);
            };

            state.mediaRecorder.onstop = () => {
                const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `character_animation_${Date.now()}.webm`;
                a.click();
                recordStatus.textContent = "✅ वीडियो सफलतापूर्वक डाउनलोड हो गया!";
            };

            // लूप में Canvas को अपडेट करना
            function renderLoop() {
                if (state.mediaRecorder && state.mediaRecorder.state === "recording") {
                    rCtx.fillStyle = '#0a0b12';
                    rCtx.fillRect(0, 0, recCanvas.width, recCanvas.height);

                    state.parts.forEach(p => {
                        rCtx.save();
                        rCtx.translate(p.x + p.width/2, p.y + p.height/2);
                        rCtx.rotate(p.rotation * Math.PI / 180);
                        rCtx.drawImage(p.img, -p.width/2, -p.height/2, p.width, p.height);
                        rCtx.restore();
                    });

                    requestAnimationFrame(renderLoop);
                }
            }

            state.mediaRecorder.start();
            renderLoop();
            recordBtn.textContent = "⏹ रिकॉर्डिंग रोकें और सेव करें";
            recordBtn.className = "btn btn-warning";
            recordStatus.textContent = "🎥 रिकॉर्डिंग चालू है... स्क्रीन पर एक्शन चलाएं!";
        }
    </script>
</body>
</html>
