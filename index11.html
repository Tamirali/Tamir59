<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A for Apple B for Ball - 3D Audio Wheel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at center, #111e38, #050b14);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px 8px 20px;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            color: #fff;
            font-size: 17px;
            margin-bottom: 2px;
            text-align: center;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ffaa00;
            letter-spacing: 1px;
        }
        .sub-title {
            color: #aac4ff;
            font-size: 11px;
            margin-bottom: 8px;
            text-align: center;
            opacity: 0.9;
        }

        /* ---- DISPLAY CARD (wide) ---- */
        #display-box {
            width: 260px;
            height: 100px;
            background: rgba(255, 255, 255, 0.96);
            border: 4px solid #ff0055;
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
            padding: 6px 12px;
            box-shadow: 0 0 40px #ff0055, 0 0 80px rgba(255, 0, 85, 0.3);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s, border-color 0.3s;
            z-index: 100;
            position: relative;
        }
        #display-box:active {
            transform: scale(0.96);
        }
        #display-box .speak-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff0055;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 20px;
            border: 2px solid #fff;
            box-shadow: 0 0 15px #ff0055;
            animation: pulse-badge 1.2s ease-in-out infinite;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }
        #display-img {
            width: 62px;
            height: 62px;
            object-fit: contain;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
        }
        #display-text {
            font-size: 22px;
            font-weight: 800;
            color: #050b14;
            text-align: left;
            line-height: 1.2;
        }
        #display-text .letter-big {
            font-size: 30px;
            color: #ff0055;
        }

        .instruction {
            font-size: 11px;
            color: #00f2fe;
            font-weight: bold;
            text-shadow: 0 0 12px #00f2fe;
            margin-top: 6px;
            text-align: center;
        }

        /* ---- 3D STAGE ---- */
        .stage-3d {
            width: 100%;
            max-width: 400px;
            height: 230px;
            perspective: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: 6px;
        }
        .pointer {
            position: absolute;
            top: -8px;
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 26px solid #ffffff;
            z-index: 50;
            filter: drop-shadow(0 0 20px #ffffff);
        }
        #chain-ring {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(-14deg);
            transition: transform 0.08s ease-out;
        }
        .chain-box {
            position: absolute;
            width: 60px;
            height: 78px;
            border: 3px solid #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            backface-visibility: visible;
            transform-style: preserve-3d;
            transition: box-shadow 0.2s, transform 0.15s;
            cursor: pointer;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            will-change: transform;
        }
        .chain-box:active {
            transform: scale(0.92) rotateY(var(--rot, 0deg)) !important;
        }

        /* ---- SPIN BUTTON ---- */
        #spin-btn {
            margin-top: 18px;
            padding: 14px 42px;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #ff0055, #ff8800);
            border: 3px solid #ffffff;
            border-radius: 40px;
            box-shadow: 0 0 30px #ff0055, 0 6px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            outline: none;
            z-index: 100;
            transition: transform 0.1s, box-shadow 0.25s, filter 0.2s;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        #spin-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px #ff0055;
        }
        #spin-btn:disabled {
            opacity: 0.5;
            transform: scale(0.96);
            pointer-events: none;
            filter: grayscale(0.5);
        }

        /* ---- SPEAKING INDICATOR ---- */
        .speaking-indicator {
            display: none;
            margin-top: 6px;
            color: #00f2fe;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 0 20px #00f2fe;
            animation: blink 0.7s ease-in-out infinite;
        }
        .speaking-indicator.active {
            display: block;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 420px) {
            #display-box {
                width: 220px;
                height: 85px;
                padding: 4px 8px;
            }
            #display-img {
                width: 50px;
                height: 50px;
            }
            #display-text {
                font-size: 18px;
            }
            #display-text .letter-big {
                font-size: 24px;
            }
            .chain-box {
                width: 50px;
                height: 66px;
                font-size: 30px;
                border-width: 2px;
            }
            .stage-3d {
                height: 190px;
            }
            #spin-btn {
                padding: 12px 28px;
                font-size: 17px;
            }
            h1 {
                font-size: 15px;
            }
        }
        @media (max-width: 360px) {
            #display-box {
                width: 185px;
                height: 72px;
            }
            #display-img {
                width: 40px;
                height: 40px;
            }
            #display-text {
                font-size: 15px;
            }
            #display-text .letter-big {
                font-size: 20px;
            }
            .chain-box {
                width: 42px;
                height: 56px;
                font-size: 24px;
            }
            .stage-3d {
                height: 160px;
            }
        }
    </style>
</head>
<body>

    <h1>🎡 3D चरखा · A for Apple B for Ball 🎡</h1>
    <div class="sub-title">👇 क्लिक करें · स्पिन करें · ऑडियो सुनें 👇</div>

    <!-- DISPLAY CARD -->
    <div id="display-box" onclick="speakCurrentLetter(true)">
        <span class="speak-badge">🔊</span>
        <img id="display-img" src="https://openmoji.org/data/color/svg/1F34E.svg" alt="apple">
        <div id="display-text"><span class="letter-big">A</span> for<br>Apple</div>
    </div>

    <div class="instruction">⬆️ डिस्प्ले पर क्लिक करके ऑडियो सुनें ⬆️</div>

    <!-- 3D STAGE -->
    <div class="stage-3d" id="stage">
        <div class="pointer"></div>
        <div id="chain-ring"></div>
    </div>

    <!-- SPIN BUTTON -->
    <button id="spin-btn" onclick="spinWheel()">🎰 SPIN WHEEL 🎰</button>

    <div class="speaking-indicator" id="speakIndicator">🔊 बोल रहा है…</div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        const letterData = {
            'A': { word: 'Apple', img: 'https://openmoji.org/data/color/svg/1F34E.svg' },
            'B': { word: 'Ball', img: 'https://openmoji.org/data/color/svg/26BD.svg' },
            'C': { word: 'Cat', img: 'https://openmoji.org/data/color/svg/1F408.svg' },
            'D': { word: 'Dog', img: 'https://openmoji.org/data/color/svg/1F415.svg' },
            'E': { word: 'Elephant', img: 'https://openmoji.org/data/color/svg/1F418.svg' },
            'F': { word: 'Fish', img: 'https://openmoji.org/data/color/svg/1F41F.svg' },
            'G': { word: 'Grapes', img: 'https://openmoji.org/data/color/svg/1F347.svg' },
            'H': { word: 'Hen', img: 'https://openmoji.org/data/color/svg/1F414.svg' },
            'I': { word: 'Ice Cream', img: 'https://openmoji.org/data/color/svg/1F366.svg' },
            'J': { word: 'Joker', img: 'https://openmoji.org/data/color/svg/1F0CF.svg' },
            'K': { word: 'Kite', img: 'https://openmoji.org/data/color/svg/1FA81.svg' },
            'L': { word: 'Lion', img: 'https://openmoji.org/data/color/svg/1F981.svg' },
            'M': { word: 'Monkey', img: 'https://openmoji.org/data/color/svg/1F412.svg' },
            'N': { word: 'Nest', img: 'https://openmoji.org/data/color/svg/1FAB6.svg' },
            'O': { word: 'Orange', img: 'https://openmoji.org/data/color/svg/1F34A.svg' },
            'P': { word: 'Parrot', img: 'https://openmoji.org/data/color/svg/1F99C.svg' },
            'Q': { word: 'Queen', img: 'https://openmoji.org/data/color/svg/1F478.svg' },
            'R': { word: 'Rose', img: 'https://openmoji.org/data/color/svg/1F339.svg' },
            'S': { word: 'Sun', img: 'https://openmoji.org/data/color/svg/2600.svg' },
            'T': { word: 'Tiger', img: 'https://openmoji.org/data/color/svg/1F405.svg' },
            'U': { word: 'Umbrella', img: 'https://openmoji.org/data/color/svg/2602.svg' },
            'V': { word: 'Van', img: 'https://openmoji.org/data/color/svg/1F690.svg' },
            'W': { word: 'Watch', img: 'https://openmoji.org/data/color/svg/231A.svg' },
            'X': { word: 'Xylophone', img: 'https://openmoji.org/data/color/svg/1FAAC.svg' },
            'Y': { word: 'Yak', img: 'https://openmoji.org/data/color/svg/1F402.svg' },
            'Z': { word: 'Zebra', img: 'https://openmoji.org/data/color/svg/1F993.svg' }
        };

        const colors = [
            "#ff0055", "#ff5000", "#ffaa00", "#4cd137", "#00a8ff", "#9c88ff",
            "#e84118", "#fbc531", "#44bd32", "#00d2d3", "#54a0ff", "#9c27b0",
            "#e91e63", "#00e676", "#ff3d00", "#00b0ff", "#651fff", "#ff1744",
            "#ffea00", "#00e5ff", "#d500f9", "#ff9100", "#1de9b6", "#c6ff00",
            "#ff80ab", "#00e676"
        ];

        // ============================================================
        //  DOM REFS
        // ============================================================
        const chainRing = document.getElementById("chain-ring");
        const displayBox = document.getElementById("display-box");
        const displayImg = document.getElementById("display-img");
        const displayText = document.getElementById("display-text");
        const stage = document.getElementById("stage");
        const spinBtn = document.getElementById("spin-btn");
        const speakIndicator = document.getElementById("speakIndicator");

        const totalLetters = letters.length;
        const angleStep = 360 / totalLetters;
        const radius = 230;

        let currentAngle = 0;
        let startX = 0;
        let isDragging = false;
        let selectedLetter = "A";
        let lastTickIndex = -1;
        let isSpinning = false;
        let isSpeaking = false;

        // ============================================================
        //  AUDIO CONTEXT for tick sounds
        // ============================================================
        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.035);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.035);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.035);
            } catch (_) { /* ignore */ }
        }

        // ============================================================
        //  BUILD 3D WHEEL
        // ============================================================
        letters.forEach((letter, index) => {
            const box = document.createElement("div");
            box.className = "chain-box";
            box.innerText = letter;
            const col = colors[index % colors.length];
            box.style.backgroundColor = col;
            box.style.boxShadow = `0 6px 18px ${col}, 0 0 14px ${col}`;
            const angle = index * angleStep;
            box.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
            box.style.setProperty('--rot', angle + 'deg');

            box.addEventListener("click", (e) => {
                e.stopPropagation();
                if (!isSpinning) {
                    rotateToLetter(index);
                }
            });

            // Hover glow
            box.addEventListener("mouseenter", () => {
                box.style.boxShadow = `0 0 30px #ffffff, 0 0 60px ${col}`;
            });
            box.addEventListener("mouseleave", () => {
                box.style.boxShadow = `0 6px 18px ${col}, 0 0 14px ${col}`;
            });

            chainRing.appendChild(box);
        });

        // ============================================================
        //  ROTATE TO LETTER (direct click)
        // ============================================================
        function rotateToLetter(index) {
            if (isSpinning) return;
            const targetAngle = -(index * angleStep);
            chainRing.style.transition = "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)";
            currentAngle = targetAngle;
            chainRing.style.transform = `rotateX(-14deg) rotateY(${currentAngle}deg)`;

            setTimeout(() => {
                chainRing.style.transition = "transform 0.08s ease-out";
                selectedLetter = letters[index];
                updateDisplay(selectedLetter, index);
                speakCurrentLetter(true);
            }, 580);
        }

        // ============================================================
        //  SPIN WHEEL
        // ============================================================
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            speakIndicator.classList.remove('active');

            const randomIndex = Math.floor(Math.random() * totalLetters);
            const extraRounds = 360 * (3 + Math.floor(Math.random() * 2));
            const targetAngle = -(randomIndex * angleStep) - extraRounds;

            chainRing.style.transition = "transform 2.8s cubic-bezier(0.08, 0.82, 0.17, 1)";
            currentAngle = targetAngle;
            chainRing.style.transform = `rotateX(-14deg) rotateY(${currentAngle}deg)`;

            // Tick sounds during spin
            let tickCount = 0;
            const maxTicks = 28;
            const tickInterval = setInterval(() => {
                if (tickCount < maxTicks) {
                    playTickSound();
                    tickCount++;
                } else {
                    clearInterval(tickInterval);
                }
            }, 100);

            setTimeout(() => {
                clearInterval(tickInterval);
                chainRing.style.transition = "transform 0.08s ease-out";
                currentAngle = -(randomIndex * angleStep);
                chainRing.style.transform = `rotateX(-14deg) rotateY(${currentAngle}deg)`;

                selectedLetter = letters[randomIndex];
                updateDisplay(selectedLetter, randomIndex);
                isSpinning = false;
                spinBtn.disabled = false;
                speakCurrentLetter(true);
            }, 2900);
        }

        // ============================================================
        //  DRAG / TOUCH
        // ============================================================
        stage.addEventListener("touchstart", (e) => {
            if (isSpinning) return;
            isDragging = true;
            startX = e.touches[0].clientX;
        });

        stage.addEventListener("touchmove", (e) => {
            if (!isDragging || isSpinning) return;
            const deltaX = e.touches[0].clientX - startX;
            startX = e.touches[0].clientX;
            currentAngle += deltaX * 0.4;
            updateChainRotation();
        });

        stage.addEventListener("touchend", () => {
            if (isSpinning) return;
            isDragging = false;
            snapToNearestLetter();
        });

        // Mouse drag support
        let mouseDown = false;
        stage.addEventListener("mousedown", (e) => {
            if (isSpinning) return;
            mouseDown = true;
            startX = e.clientX;
        });
        window.addEventListener("mousemove", (e) => {
            if (!mouseDown || isSpinning) return;
            const deltaX = e.clientX - startX;
            startX = e.clientX;
            currentAngle += deltaX * 0.4;
            updateChainRotation();
        });
        window.addEventListener("mouseup", () => {
            if (mouseDown && !isSpinning) {
                mouseDown = false;
                snapToNearestLetter();
            }
            mouseDown = false;
        });

        // ============================================================
        //  UPDATE FUNCTIONS
        // ============================================================
        function updateChainRotation() {
            chainRing.style.transform = `rotateX(-14deg) rotateY(${currentAngle}deg)`;
            highlightFrontLetter();
        }

        function highlightFrontLetter() {
            let normalized = (-currentAngle) % 360;
            if (normalized < 0) normalized += 360;
            const index = Math.round(normalized / angleStep) % totalLetters;
            if (index !== lastTickIndex) {
                playTickSound();
                lastTickIndex = index;
            }
            const activeLetter = letters[index];
            if (activeLetter && activeLetter !== selectedLetter) {
                selectedLetter = activeLetter;
                updateDisplay(selectedLetter, index);
            }
        }

        function updateDisplay(letter, index) {
            const data = letterData[letter] || { word: letter, img: '' };
            const col = colors[index % colors.length];
            displayImg.style.transform = 'scale(0.5) rotate(-8deg)';
            setTimeout(() => {
                displayImg.src = data.img;
                displayText.innerHTML = `<span class="letter-big">${letter}</span> for<br>${data.word}`;
                displayImg.style.transform = 'scale(1) rotate(0deg)';
            }, 80);
            displayBox.style.boxShadow = `0 0 45px ${col}, 0 0 90px ${col}44`;
            displayBox.style.borderColor = col;
        }

        function snapToNearestLetter() {
            let normalized = (-currentAngle) % 360;
            if (normalized < 0) normalized += 360;
            const index = Math.round(normalized / angleStep) % totalLetters;
            const targetAngle = -(index * angleStep);

            chainRing.style.transition = "transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)";
            currentAngle = targetAngle;
            chainRing.style.transform = `rotateX(-14deg) rotateY(${currentAngle}deg)`;

            setTimeout(() => {
                chainRing.style.transition = "transform 0.08s ease-out";
                selectedLetter = letters[index];
                updateDisplay(selectedLetter, index);
                speakCurrentLetter(true);
            }, 380);
        }

        // ============================================================
        //  SPEECH SYNTHESIS (AUDIO) — MAIN AUDIO FUNCTION
        // ============================================================
        function speakCurrentLetter(force = false) {
            if (isSpeaking && !force) return;
            if (!('speechSynthesis' in window)) {
                console.warn('Speech synthesis not supported');
                return;
            }

            // Cancel any pending speech
            window.speechSynthesis.cancel();

            const data = letterData[selectedLetter];
            if (!data) return;

            const text = `${selectedLetter} for ${data.word}`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.82;
            utterance.pitch = 1.0;
            utterance.volume = 1;

            // Show speaking indicator
            isSpeaking = true;
            speakIndicator.classList.add('active');

            utterance.onstart = () => {
                isSpeaking = true;
                speakIndicator.classList.add('active');
                // Pulse the display box
                displayBox.style.transform = 'scale(1.02)';
                setTimeout(() => { displayBox.style.transform = ''; }, 300);
            };

            utterance.onend = () => {
                isSpeaking = false;
                speakIndicator.classList.remove('active');
            };

            utterance.onerror = () => {
                isSpeaking = false;
                speakIndicator.classList.remove('active');
            };

            // Try to get a good voice
            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'));
            if (preferred) utterance.voice = preferred;

            window.speechSynthesis.speak(utterance);

            // Fallback: if speaking takes too long, reset indicator
            setTimeout(() => {
                if (isSpeaking) {
                    // Check if still speaking
                    if (window.speechSynthesis.speaking) return;
                    isSpeaking = false;
                    speakIndicator.classList.remove('active');
                }
            }, 5000);
        }

        // Preload voices (some browsers need this)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // ============================================================
        //  AUTO-SPEAK ON PAGE LOAD (with user interaction fallback)
        // ============================================================
        let hasSpokenOnLoad = false;

        function autoSpeakOnLoad() {
            if (hasSpokenOnLoad) return;
            hasSpokenOnLoad = true;
            // Speak after a short delay to let everything render
            setTimeout(() => {
                // Ensure audio context is resumed
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                speakCurrentLetter(true);
            }, 600);
        }

        // Try auto-speak on load
        window.addEventListener('load', () => {
            // Update display with A
            updateDisplay('A', 0);
            // Auto-speak after a tiny delay
            setTimeout(autoSpeakOnLoad, 500);
        });

        // Also speak on first user interaction (tap/click) if auto-speak didn't work
        const firstInteraction = () => {
            if (!hasSpokenOnLoad) {
                autoSpeakOnLoad();
            }
            // Resume audio context on user gesture
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        };
        document.addEventListener('click', firstInteraction, { once: true });
        document.addEventListener('touchstart', firstInteraction, { once: true });

        // ============================================================
        //  KEYBOARD SHORTCUT: Space to spin, Enter/S to speak
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                spinWheel();
            }
            if (e.key === 'Enter' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                speakCurrentLetter(true);
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        updateDisplay('A', 0);
        console.log('🎡 3D Alphabet Wheel loaded! Click any letter, spin, or tap the display to hear audio.');
        console.log('🔄 Keyboard: Space = Spin, Enter/S = Speak');
    </script>

</body>
</html>
