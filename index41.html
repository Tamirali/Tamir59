<!DOCTYPE html> 
<html lang="hi"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>🏪 डिजिटल दुकान & WhatsApp कैटलॉग (Zoom Feature Included)</title> 
    <style> 
        :root { 
            --primary: #0984e3; 
            --primary-dark: #0652DD; 
            --whatsapp: #25D366; 
            --bg: #f4f6f9; 
            --card: #ffffff; 
            --text: #2d3436; 
            --border: #e2e8f0; 
            --red: #ff6b6b; 
            --shadow: 0 4px 15px rgba(0,0,0,0.08); 
        } 
 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        } 
 
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
        } 
 
        .container { 
            width: 100%; 
            max-width: 800px; 
            background: var(--card); 
            border-radius: 12px; 
            box-shadow: var(--shadow); 
            padding: 16px; 
        } 
 
        header { 
            text-align: center; 
            margin-bottom: 16px; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 12px; 
        } 
 
        header h1 { 
            font-size: 22px; 
            color: var(--primary-dark); 
        } 
 
        /* Nav Tabs */ 
        .tabs { 
            display: flex; 
            gap: 6px; 
            background: #eee; 
            padding: 4px; 
            border-radius: 8px; 
            margin-bottom: 16px; 
        } 
 
        .tab-btn { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            background: transparent; 
            font-weight: bold; 
            font-size: 13px; 
            color: #666; 
            cursor: pointer; 
            border-radius: 6px; 
        } 
 
        .tab-btn.active { 
            background: var(--primary); 
            color: white; 
        } 
 
        .tab-content { display: none; } 
        .tab-content.active { display: block; } 
 
        .card { 
            background: #fff; 
            border: 1px solid var(--border); 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 14px; 
        } 
 
        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            margin-top: 8px; 
        } 
 
        input, button { 
            padding: 10px; 
            font-size: 14px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            outline: none; 
        } 
 
        button { 
            cursor: pointer; 
            font-weight: bold; 
        } 
 
        .btn-primary { background: var(--primary); color: white; border: none; } 
        .btn-whatsapp { background: var(--whatsapp); color: white; border: none; width: 100%; font-size: 16px; } 
        .btn-red { background: var(--red); color: white; border: none; } 
 
        /* Product Grid */ 
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 12px; 
            margin-top: 10px; 
        } 
 
        .product-card { 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            overflow: hidden; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        } 
 
        .product-card img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
            background: #f0f0f0; 
            cursor: pointer; 
            transition: opacity 0.2s; 
        } 
 
        .product-card img:hover { 
            opacity: 0.9; 
        } 
 
        .product-details { 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        } 
 
        .product-title { font-weight: bold; font-size: 14px; } 
        .product-price { color: #00b894; font-weight: bold; font-size: 15px; } 
 
        /* Preview Area */ 
        #imgPreview { 
            max-width: 100%; 
            height: 120px; 
            object-fit: contain; 
            display: none; 
            margin-top: 8px; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
        } 
 
        .info { font-size: 12px; color: #27ae60; font-weight: bold; } 
 
        /* Cart Styling */ 
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            padding: 8px 0; 
        } 
 
        .qty-controls { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        } 
 
        .qty-btn { 
            width: 26px; 
            height: 26px; 
            padding: 0; 
            border-radius: 4px; 
            background: #eee; 
            border: 1px solid #ccc; 
        } 
 
        /* ZOOM MODAL STYLING */ 
        .image-modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.9); 
            touch-action: none; /* Disables page scroll when zooming */ 
            overflow: hidden; 
        } 
 
        .modal-close { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            color: #fff; 
            font-size: 35px; 
            font-weight: bold; 
            cursor: pointer; 
            z-index: 1001; 
            background: rgba(0,0,0,0.5); 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1; 
        } 
 
        .modal-container { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        } 
 
        .modal-container img { 
            max-width: 90%; 
            max-height: 85%; 
            transform-origin: center center; 
            transition: transform 0.05s linear; 
            user-select: none; 
        } 
 
        .zoom-hint { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: white; 
            font-size: 13px; 
            background: rgba(0,0,0,0.6); 
            padding: 6px 14px; 
            border-radius: 20px; 
            pointer-events: none; 
        } 
 
        @media (max-width: 480px) { 
            .product-grid { grid-template-columns: repeat(2, 1fr); } 
        } 
    </style> 
 
    <!-- Firebase SDKs --> 
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script> 
</head> 
<body> 
 
<div class="container"> 
    <header> 
        <h1 id="storeTitle">🏪 डिजिटल कैटलॉग दुकान</h1> 
    </header> 
 
    <!-- TABS --> 
    <div class="tabs"> 
        <button class="tab-btn active" onclick="switchTab('store')">🛍️ दुकान (कैटलॉग)</button> 
        <button class="tab-btn" onclick="switchTab('cart')">🛒 कार्ट (<span id="cartCount">0</span>)</button> 
        <button class="tab-btn" onclick="switchTab('admin')">⚙️ दुकानदार पैनल</button> 
    </div> 
 
    <!-- TAB 1: STORE / CATALOG --> 
    <div id="tab-store" class="tab-content active"> 
        <h3>सामान की सूची <small style="font-size:12px; color:#666; font-weight:normal;">(फोटो पर क्लिक करके ज़ूम करें)</small></h3> 
        <div id="productList" class="product-grid"></div> 
    </div> 
 
    <!-- TAB 2: CART & CHECKOUT --> 
    <div id="tab-cart" class="tab-content"> 
        <h3>🛒 आपकी कार्ट</h3> 
        <div id="cartItems" style="margin-top: 10px;"></div> 
         
        <div class="card" style="margin-top: 15px;"> 
            <h4>ग्राहक विवरण दर्ज करें:</h4> 
            <div class="form-group"> 
                <input type="text" id="custName" placeholder="आपका नाम"> 
                <input type="text" id="custAddress" placeholder="पूरा पता (Address)"> 
            </div> 
            <div style="display:flex; justify-content: space-between; font-weight:bold; font-size:16px; margin: 12px 0;"> 
                <span>कुल योग:</span> 
                <span id="cartTotal" style="color: #00b894;">₹ 0.00</span> 
            </div> 
            <button class="btn-whatsapp" onclick="sendWhatsAppOrder()">📲 WhatsApp पर ऑर्डर भेजें</button> 
        </div> 
    </div> 
 
    <!-- TAB 3: ADMIN (ADD PRODUCTS & SHOP INFO) --> 
    <div id="tab-admin" class="tab-content"> 
        <div class="card"> 
            <h3>⚙️ दुकान की जानकारी</h3> 
            <div class="form-group"> 
                <input type="text" id="shopNameInput" placeholder="दुकान का नाम"> 
                <input type="tel" id="shopPhoneInput" placeholder="दुकानदार का WhatsApp नंबर (जैसे: 919876543210)"> 
                <button class="btn-primary" onclick="saveShopDetails()">जानकारी सेव करें</button> 
            </div> 
        </div> 
 
        <div class="card"> 
            <h3>+ नया प्रोडक्ट जोड़ें</h3> 
            <div class="form-group"> 
                <input type="text" id="prodName" placeholder="प्रोडक्ट का नाम"> 
                <input type="number" id="prodPrice" placeholder="कीमत (₹)"> 
                 
                <label style="font-size: 13px; font-weight: bold; margin-top: 5px;">प्रोडक्ट फोटो चुनें:</label> 
                <input type="file" id="prodFile" accept="image/*" onchange="compressAndPreviewImage(event)"> 
                 
                <img id="imgPreview" alt="Compressed Preview"> 
                <div class="info" id="fileInfo"></div> 
 
                <button class="btn-primary" id="addBtn" onclick="addProduct()">प्रोडक्ट अपलोड करें</button> 
            </div> 
        </div> 
 
        <div class="card"> 
            <h3>मौजूदा प्रोडक्ट्स</h3> 
            <div id="adminProductList"></div> 
        </div> 
    </div> 
</div> 
 
<!-- IMAGE ZOOM MODAL --> 
<div id="zoomModal" class="image-modal"> 
    <span class="modal-close" onclick="closeZoomModal()">&times;</span> 
    <div class="modal-container" id="modalContainer"> 
        <img id="zoomedImage" src="" alt="Zoomed Product"> 
    </div> 
    <div class="zoom-hint">👈👉 उंगलियों से छोटा/बड़ा व स्क्रॉल करें</div> 
</div> 
 
<script> 
    const firebaseConfig = { 
        apiKey: "AIzaSyDtaClRWwPTztkE7IeaKLL1SgpGxCiComs", 
        authDomain: "digital-shop-123bd.firebaseapp.com", 
        projectId: "digital-shop-123bd", 
        messagingSenderId: "341178707601", 
        appId: "1:341178707601:web:e22f55a473b345b8701930", 
        measurementId: "G-33DY31Q2EB" 
    }; 
 
    firebase.initializeApp(firebaseConfig); 
    const db = firebase.firestore(); 
 
    let shopInfo = { name: 'मेरी डिजिटल दुकान', phone: '918797221991' }; 
    let products = []; 
    let cart = []; 
    let base64Image = ""; 
 
    function switchTab(tabId) { 
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); 
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active')); 
         
        if (event && event.target) { 
            event.target.classList.add('active'); 
        } 
        document.getElementById('tab-' + tabId).classList.add('active'); 
    } 
 
    // High Compression Image Logic 
    function compressAndPreviewImage(e) { 
        const file = e.target.files[0]; 
        if (!file) return; 
 
        const reader = new FileReader(); 
        reader.readAsDataURL(file); 
        reader.onload = function(event) { 
            const img = new Image(); 
            img.src = event.target.result; 
            img.onload = function() { 
                const canvas = document.createElement('canvas'); 
                const ctx = canvas.getContext('2d'); 
 
                let width = img.width; 
                let height = img.height; 
                const maxDim = 600; 
 
                if (width > maxDim || height > maxDim) { 
                    if (width > height) { 
                        height = Math.round((height * maxDim) / width); 
                        width = maxDim; 
                    } else { 
                        width = Math.round((width * maxDim) / height); 
                        height = maxDim; 
                    } 
                } 
 
                canvas.width = width; 
                canvas.height = height; 
                ctx.drawImage(img, 0, 0, width, height); 
 
                base64Image = canvas.toDataURL('image/jpeg', 0.6); 
 
                const preview = document.getElementById('imgPreview'); 
                preview.src = base64Image; 
                preview.style.display = 'block'; 
 
                const approxKB = Math.round((base64Image.length * 0.75) / 1024); 
                document.getElementById('fileInfo').innerText = `कंप्रेस साइज़: ~${approxKB} KB`; 
            }; 
        }; 
    } 
 
    function loadFirebaseData() { 
        db.collection('settings').doc('shopInfo').onSnapshot(doc => { 
            if (doc.exists) { 
                shopInfo = doc.data(); 
                document.getElementById('storeTitle').innerText = '🏪 ' + shopInfo.name; 
                document.getElementById('shopNameInput').value = shopInfo.name; 
                document.getElementById('shopPhoneInput').value = shopInfo.phone; 
            } 
        }); 
 
        db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => { 
            products = []; 
            snapshot.forEach(doc => { 
                products.push({ id: doc.id, ...doc.data() }); 
            }); 
            renderAll(); 
        }, err => console.error("Firestore Read Error:", err)); 
    } 
 
    function saveShopDetails() { 
        const name = document.getElementById('shopNameInput').value.trim(); 
        let phone = document.getElementById('shopPhoneInput').value.trim(); 
 
        if(!name || !phone) return alert('कृपया नाम और नंबर दोनों भरें!'); 
        phone = phone.replace(/[^0-9]/g, ''); 
 
        db.collection('settings').doc('shopInfo').set({ name, phone }) 
            .then(() => alert('दुकान की जानकारी सेव हो गई!')) 
            .catch(err => alert('Error: ' + err.message)); 
    } 
 
    async function addProduct() { 
        const name = document.getElementById('prodName').value.trim(); 
        const price = parseFloat(document.getElementById('prodPrice').value); 
        const addBtn = document.getElementById('addBtn'); 
 
        if (!name || isNaN(price)) return alert('सही नाम और कीमत दर्ज करें!'); 
        if (!base64Image) return alert('कृपया एक फोटो अपलोड करें!'); 
 
        try { 
            addBtn.innerText = 'अपलोड हो रहा है...'; 
            addBtn.disabled = true; 
 
            await db.collection('products').add({ 
                name: name, 
                price: price, 
                img: base64Image, 
                createdAt: firebase.firestore.FieldValue.serverTimestamp() 
            }); 
 
            alert('प्रोडक्ट सफलता से अपलोड हो गया!'); 
 
            document.getElementById('prodName').value = ''; 
            document.getElementById('prodPrice').value = ''; 
            document.getElementById('prodFile').value = ''; 
            document.getElementById('imgPreview').style.display = 'none'; 
            document.getElementById('fileInfo').innerText = ''; 
            base64Image = ""; 
 
        } catch (error) { 
            alert('अपलोड में समस्या आई: ' + error.message); 
        } finally { 
            addBtn.innerText = 'प्रोडक्ट अपलोड करें'; 
            addBtn.disabled = false; 
        } 
    } 
 
    function deleteProduct(id) { 
        if(confirm('क्या आप इस प्रोडक्ट को हटाना चाहते हैं?')) { 
            db.collection('products').doc(id).delete().then(() => { 
                cart = cart.filter(c => c.id !== id); 
                renderCart(); 
            }); 
        } 
    } 
 
    function addToCart(id) { 
        const prod = products.find(p => p.id === id); 
        const cartItem = cart.find(c => c.id === id); 
 
        if (cartItem) { 
            cartItem.qty++; 
        } else { 
            cart.push({ ...prod, qty: 1 }); 
        } 
        renderCart(); 
    } 
 
    function updateQty(id, change) { 
        const cartItem = cart.find(c => c.id === id); 
        if (cartItem) { 
            cartItem.qty += change; 
            if (cartItem.qty <= 0) { 
                cart = cart.filter(c => c.id !== id); 
            } 
        } 
        renderCart(); 
    } 
 
    function sendWhatsAppOrder() { 
        if (cart.length === 0) return alert('आपकी कार्ट खाली है!'); 
         
        const custName = document.getElementById('custName').value.trim(); 
        const custAddress = document.getElementById('custAddress').value.trim(); 
 
        if (!custName || !custAddress) return alert('कृपया अपना नाम और पता दर्ज करें!'); 
 
        let text = `📦 *नया ऑर्डर - ${shopInfo.name}*\n---------------------------------\n👤 *ग्राहक का नाम:* ${custName}\n📍 *पता:* ${custAddress}\n---------------------------------\n📝 *ऑर्डर की सूची:*\n`; 
 
        let total = 0; 
        cart.forEach((item, index) => { 
            const itemTotal = item.price * item.qty; 
            total += itemTotal; 
            text += `${index + 1}. ${item.name} x ${item.qty} = ₹${itemTotal.toFixed(2)}\n`; 
        }); 
 
        text += `---------------------------------\n💰 *कुल योग: ₹${total.toFixed(2)}*\n\nकृपया ऑर्डर कन्फर्म करें। धन्यवाद! 🙏`; 
 
        let phone = shopInfo.phone; 
        if (!phone.startsWith('91') && phone.length === 10) phone = '91' + phone; 
 
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`; 
        window.open(url, '_blank'); 
    } 
 
    function renderAll() { 
        const grid = document.getElementById('productList'); 
        grid.innerHTML = ''; 
        if (products.length === 0) { 
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777;">कोई प्रोडक्ट नहीं है। एडमिन पैनल से जोड़ें।</p>'; 
        } 
        products.forEach(p => { 
            grid.innerHTML += ` 
                <div class="product-card"> 
                    <img src="${p.img}" alt="${p.name}" onclick="openZoomModal('${p.img}')" title="ज़ूम करने के लिए क्लिक करें"> 
                    <div class="product-details"> 
                        <div class="product-title">${p.name}</div> 
                        <div class="product-price">₹ ${p.price.toFixed(2)}</div> 
                        <button class="btn-primary" style="margin-top:6px; font-size:12px;" onclick="addToCart('${p.id}')">+ कार्ट में जोड़ें</button> 
                    </div> 
                </div>`; 
        }); 
 
        const adminList = document.getElementById('adminProductList'); 
        adminList.innerHTML = ''; 
        products.forEach(p => { 
            adminList.innerHTML += ` 
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:6px 0;"> 
                    <span><strong>${p.name}</strong> - ₹${p.price}</span> 
                    <button class="btn-red" style="padding:4px 8px; font-size:12px;" onclick="deleteProduct('${p.id}')">🗑️ हटाएँ</button> 
                </div>`; 
        }); 
 
        renderCart(); 
    } 
 
    function renderCart() { 
        const cartDiv = document.getElementById('cartItems'); 
        cartDiv.innerHTML = ''; 
        let total = 0; 
        let count = 0; 
 
        if (cart.length === 0) { 
            cartDiv.innerHTML = '<p style="text-align:center; color:#777; padding:10px;">आपकी कार्ट खाली है।</p>'; 
        } 
 
        cart.forEach(item => { 
            const itemTotal = item.price * item.qty; 
            total += itemTotal; 
            count += item.qty; 
 
            cartDiv.innerHTML += ` 
                <div class="cart-item"> 
                    <div> 
                        <strong>${item.name}</strong><br> 
                        <small style="color:#666;">₹${item.price} x ${item.qty} = ₹${itemTotal.toFixed(2)}</small> 
                    </div> 
                    <div class="qty-controls"> 
                        <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button> 
                        <span>${item.qty}</span> 
                        <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button> 
                    </div> 
                </div>`; 
        }); 
 
        document.getElementById('cartCount').innerText = count; 
        document.getElementById('cartTotal').innerText = '₹ ' + total.toFixed(2); 
    } 
 
    // --- PINCH TO ZOOM & DRAG LOGIC --- 
    const modal = document.getElementById('zoomModal'); 
    const zoomedImg = document.getElementById('zoomedImage'); 
    const modalContainer = document.getElementById('modalContainer'); 
 
    let scale = 1; 
    let pointX = 0; 
    let pointY = 0; 
    let start = { x: 0, y: 0 }; 
    let initialDistance = 0; 
 
    function openZoomModal(imgSrc) { 
        zoomedImg.src = imgSrc; 
        modal.style.display = 'block'; 
        resetZoom(); 
    } 
 
    function closeZoomModal() { 
        modal.style.display = 'none'; 
        resetZoom(); 
    } 
 
    function resetZoom() { 
        scale = 1; 
        pointX = 0; 
        pointY = 0; 
        updateTransform(); 
    } 
 
    function updateTransform() { 
        zoomedImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; 
    } 
 
    function getDistance(touches) { 
        return Math.hypot( 
            touches[0].clientX - touches[1].clientX, 
            touches[0].clientY - touches[1].clientY 
        ); 
    } 
 
    modalContainer.addEventListener('touchstart', function(e) { 
        if (e.touches.length === 1) { 
            start = { x: e.touches[0].clientX - pointX, y: e.touches[0].clientY - pointY }; 
        } else if (e.touches.length === 2) { 
            initialDistance = getDistance(e.touches); 
        } 
    }); 
 
    modalContainer.addEventListener('touchmove', function(e) { 
        e.preventDefault(); 
        if (e.touches.length === 1 && scale > 1) { 
            pointX = e.touches[0].clientX - start.x; 
            pointY = e.touches[0].clientY - start.y; 
            updateTransform(); 
        } else if (e.touches.length === 2) { 
            const currentDistance = getDistance(e.touches); 
            const factor = currentDistance / initialDistance; 
            scale = Math.min(Math.max(1, scale * factor), 4); // Max 4x zoom 
            initialDistance = currentDistance; 
            updateTransform(); 
        } 
    }); 
 
    // Double Tap to Quick Zoom 
    let lastTap = 0; 
    modalContainer.addEventListener('touchend', function(e) { 
        const currentTime = new Date().getTime(); 
        const tapLength = currentTime - lastTap; 
        if (tapLength < 300 && tapLength > 0) { 
            if (scale > 1) { 
                resetZoom(); 
            } else { 
                scale = 2.5; 
                updateTransform(); 
            } 
            e.preventDefault(); 
        } 
        lastTap = currentTime; 
    }); 
 
    loadFirebaseData(); 
</script> 
 
</body> 
</html>
