<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 डिजिटल दुकान & WhatsApp कैटलॉग</title>
    <style>
        :root {
            --primary: #0984e3;
            --primary-dark: #0652DD;
            --whatsapp: #25D366;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #2d3436;
            --border: #e2e8f0;
            --red: #ff6b6b;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        header h1 {
            font-size: 22px;
            color: var(--primary-dark);
        }

        /* Nav Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            background: #eee;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            border-radius: 6px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        input, button {
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-whatsapp { background: var(--whatsapp); color: white; border: none; width: 100%; font-size: 16px; }
        .btn-red { background: var(--red); color: white; border: none; }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .product-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: #f0f0f0;
        }

        .product-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-title { font-weight: bold; font-size: 14px; }
        .product-price { color: #00b894; font-weight: bold; font-size: 15px; }

        /* Cart Styling */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            border-radius: 4px;
            background: #eee;
            border: 1px solid #ccc;
        }

        @media (max-width: 480px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="storeTitle">🏪 डिजिटल कैटलॉग दुकान</h1>
    </header>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('store')">🛍️ दुकान (कैटलॉग)</button>
        <button class="tab-btn" onclick="switchTab('cart')">🛒 कार्ट (<span id="cartCount">0</span>)</button>
        <button class="tab-btn" onclick="switchTab('admin')">⚙️ दुकानदार पैनल</button>
    </div>

    <!-- TAB 1: STORE / CATALOG -->
    <div id="tab-store" class="tab-content active">
        <h3>सामान की सूची</h3>
        <div id="productList" class="product-grid"></div>
    </div>

    <!-- TAB 2: CART & CHECKOUT -->
    <div id="tab-cart" class="tab-content">
        <h3>🛒 आपकी कार्ट</h3>
        <div id="cartItems" style="margin-top: 10px;"></div>
        
        <div class="card" style="margin-top: 15px;">
            <h4>ग्राहक विवरण दर्ज करें:</h4>
            <div class="form-group">
                <input type="text" id="custName" placeholder="आपका नाम">
                <input type="text" id="custAddress" placeholder="पूरा पता (Address)">
            </div>
            <div style="display:flex; justify-size: space-between; font-weight:bold; font-size:16px; margin: 12px 0;">
                <span>कुल योग:</span>
                <span id="cartTotal" style="color: #00b894;">₹ 0.00</span>
            </div>
            <button class="btn-whatsapp" onclick="sendWhatsAppOrder()">📲 WhatsApp पर ऑर्डर भेजें</button>
        </div>
    </div>

    <!-- TAB 3: ADMIN (ADD PRODUCTS & SHOP INFO) -->
    <div id="tab-admin" class="tab-content">
        <div class="card">
            <h3>⚙️ दुकान की जानकारी</h3>
            <div class="form-group">
                <input type="text" id="shopNameInput" placeholder="दुकान का नाम">
                <input type="tel" id="shopPhoneInput" placeholder="दुकानदार का WhatsApp नंबर (जैसे: 919876543210)">
                <button class="btn-primary" onclick="saveShopDetails()">जानकारी सेव करें</button>
            </div>
        </div>

        <div class="card">
            <h3>+ नया प्रोडक्ट जोड़ें</h3>
            <div class="form-group">
                <input type="text" id="prodName" placeholder="प्रोडक्ट का नाम">
                <input type="number" id="prodPrice" placeholder="कीमत (₹)">
                <input type="text" id="prodImage" placeholder="फोटो का लिंक/URL (ऐच्छिक)">
                <button class="btn-primary" onclick="addProduct()">प्रोडक्ट जोड़ें</button>
            </div>
        </div>

        <div class="card">
            <h3>मौजूदा प्रोडक्ट्स</h3>
            <div id="adminProductList"></div>
        </div>
    </div>
</div>

<script>
    // LocalStorage Keys
    let shopInfo = JSON.parse(localStorage.getItem('wc_shop_info')) || { name: 'मेरी डिजिटल दुकान', phone: '918797221991' };
    let products = JSON.parse(localStorage.getItem('wc_products')) || [
        { id: 1, name: 'ताज़ा चाय', price: 20, img: 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=300' },
        { id: 2, name: 'कॉफ़ी', price: 40, img: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300' }
    ];
    let cart = [];

    function saveData() {
        localStorage.setItem('wc_shop_info', JSON.stringify(shopInfo));
        localStorage.setItem('wc_products', JSON.stringify(products));
        renderAll();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
    }

    // ADMIN FUNCTIONS
    function saveShopDetails() {
        const name = document.getElementById('shopNameInput').value.trim();
        let phone = document.getElementById('shopPhoneInput').value.trim();

        if(!name || !phone) return alert('कृपया नाम और नंबर दोनों भरें!');
        phone = phone.replace(/[^0-9]/g, '');

        shopInfo = { name, phone };
        saveData();
        alert('दुकान की जानकारी सेव हो गई!');
    }

    function addProduct() {
        const name = document.getElementById('prodName').value.trim();
        const price = parseFloat(document.getElementById('prodPrice').value);
        let img = document.getElementById('prodImage').value.trim();

        if (!name || isNaN(price)) return alert('सही नाम और कीमत दर्ज करें!');
        if (!img) img = 'https://via.placeholder.com/150?text=No+Image';

        products.push({ id: Date.now(), name, price, img });
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodImage').value = '';
        saveData();
    }

    function deleteProduct(id) {
        if(confirm('क्या आप इस प्रोडक्ट को हटाना चाहते हैं?')) {
            products = products.filter(p => p.id !== id);
            cart = cart.filter(c => c.id !== id);
            saveData();
        }
    }

    // CART FUNCTIONS
    function addToCart(id) {
        const prod = products.find(p => p.id === id);
        const cartItem = cart.find(c => c.id === id);

        if (cartItem) {
            cartItem.qty++;
        } else {
            cart.push({ ...prod, qty: 1 });
        }
        renderCart();
    }

    function updateQty(id, change) {
        const cartItem = cart.find(c => c.id === id);
        if (cartItem) {
            cartItem.qty += change;
            if (cartItem.qty <= 0) {
                cart = cart.filter(c => c.id !== id);
            }
        }
        renderCart();
    }

    // SEND ORDER TO WHATSAPP
    function sendWhatsAppOrder() {
        if (cart.length === 0) return alert('आपकी कार्ट खाली है!');
        
        const custName = document.getElementById('custName').value.trim();
        const custAddress = document.getElementById('custAddress').value.trim();

        if (!custName || !custAddress) return alert('कृपया अपना नाम और पता दर्ज करें!');

        let text = `📦 *नया ऑर्डर - ${shopInfo.name}*\n`;
        text += `---------------------------------\n`;
        text += `👤 *ग्राहक का नाम:* ${custName}\n`;
        text += `📍 *पता:* ${custAddress}\n`;
        text += `---------------------------------\n`;
        text += `📝 *ऑर्डर की सूची:*\n`;

        let total = 0;
        cart.forEach((item, index) => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            text += `${index + 1}. ${item.name} x ${item.qty} = ₹${itemTotal.toFixed(2)}\n`;
        });

        text += `---------------------------------\n`;
        text += `💰 *कुल योग: ₹${total.toFixed(2)}*\n\n`;
        text += `कृपया ऑर्डर कन्फर्म करें। धन्यवाद! 🙏`;

        let phone = shopInfo.phone;
        if (!phone.startsWith('91') && phone.length === 10) phone = '91' + phone;

        const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }

    // RENDER FUNCTIONS
    function renderAll() {
        // Update Title and Admin Inputs
        document.getElementById('storeTitle').innerText = '🏪 ' + shopInfo.name;
        document.getElementById('shopNameInput').value = shopInfo.name;
        document.getElementById('shopPhoneInput').value = shopInfo.phone;

        // Render Catalog Grid
        const grid = document.getElementById('productList');
        grid.innerHTML = '';
        if (products.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777;">कोई प्रोडक्ट नहीं है। एडमिन पैनल से जोड़ें।</p>';
        }
        products.forEach(p => {
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="product-details">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">₹ ${p.price.toFixed(2)}</div>
                        <button class="btn-primary" style="margin-top:6px; font-size:12px;" onclick="addToCart(${p.id})">+ कार्ट में जोड़ें</button>
                    </div>
                </div>`;
        });

        // Render Admin Product List
        const adminList = document.getElementById('adminProductList');
        adminList.innerHTML = '';
        products.forEach(p => {
            adminList.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:6px 0;">
                    <span><strong>${p.name}</strong> - ₹${p.price}</span>
                    <button class="btn-red" style="padding:4px 8px; font-size:12px;" onclick="deleteProduct(${p.id})">🗑️ हटाएँ</button>
                </div>`;
        });

        renderCart();
    }

    function renderCart() {
        const cartDiv = document.getElementById('cartItems');
        cartDiv.innerHTML = '';

        let total = 0;
        let count = 0;

        if (cart.length === 0) {
            cartDiv.innerHTML = '<p style="text-align:center; color:#777; padding:10px;">आपकी कार्ट खाली है।</p>';
        }

        cart.forEach(item => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            count += item.qty;

            cartDiv.innerHTML += `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small style="color:#666;">₹${item.price} x ${item.qty} = ₹${itemTotal.toFixed(2)}</small>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                </div>`;
        });

        document.getElementById('cartCount').innerText = count;
        document.getElementById('cartTotal').innerText = '₹ ' + total.toFixed(2);
    }

    // Initial Render
    renderAll();
</script>

</body>
</html>
