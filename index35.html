<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧾 QR Bill Generator + Scanner</title>
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* ----- CSS Variables & Reset ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0984e3;
            --primary-light: #74b9ff;
            --primary-dark: #0652DD;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --font: 'Segoe UI', system-ui, sans-serif;
            --green: #00b894;
            --red: #ff6b6b;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 780px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 16px;
        }

        /* ----- Header ----- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header .badge {
            font-size: 12px;
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 30px;
            color: var(--text-light);
            font-weight: 600;
        }

        /* ----- Tabs ----- */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.25);
        }

        .tab-content {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--primary-dark);
        }

        /* ----- Form ----- */
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .form-row input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            background: #fafbfc;
            min-width: 120px;
        }
        .form-row input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: #fff;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--green); color: #fff; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-whatsapp { background: #25D366; color: #fff; }
        .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-sm { padding: 8px 12px; font-size: 13px; }

        /* ----- QR Display ----- */
        .qr-display {
            text-align: center;
            padding: 10px 0;
        }
        .qr-display img {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 8px;
            background: #fff;
            max-width: 180px;
        }
        .qr-data {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-light);
        }

        /* ----- Scanner ----- */
        #scanner-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            min-height: 200px;
        }
        .scanner-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .scanner-status {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        /* ----- Bill Section ----- */
        .bill-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .bill-header-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-light);
            border-bottom: 1px dashed #e9ecef;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .bill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px #f0f2f5;
            font-size: 14px;
        }
        .bill-item .item-details {
            display: flex;
            flex-direction: column;
        }
        .bill-item .shop {
            font-size: 11px;
            color: var(--text-light);
        }
        .bill-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            padding-top: 10px;
            margin-top: 8px;
            border-top: 2px solid var(--primary);
        }
        .bill-total .total-amount { color: var(--green); }

        /* WhatsApp Input Box */
        .whatsapp-box {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #e9ecef;
        }
        .whatsapp-box input {
            flex: 1;
            padding: 8px 12px;
            border: 1.5px solid #e9ecef;
            border-radius: 8px;
            font-size: 13px;
        }

        .bill-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .empty-bill {
            text-align: center;
            color: var(--text-light);
            padding: 15px 0;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .form-row { flex-direction: column; }
            .bill-actions { flex-direction: column; }
            .bill-actions .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <div class="app-header">
            <h1>🧾 QR Bill System</h1>
            <span class="badge" id="scanCount">0 स्कैन</span>
        </div>

        <!-- ===== TABS ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="generate">📱 QR बनाएँ</button>
            <button class="tab-btn" data-tab="scan">📷 स्कैन & बिल</button>
        </div>

        <!-- TAB 1: GENERATOR -->
        <div class="tab-content active" id="tab-generate">
            <h2>📱 QR कोड जनरेटर</h2>
            <div class="form-row">
                <input type="text" id="shopName" placeholder="दुकान का नाम" value="मेरी दुकान" />
                <input type="text" id="productName" placeholder="उत्पाद का नाम" value="चाय" />
                <input type="number" id="productPrice" placeholder="मूल्य (₹)" value="20" step="0.01" />
                <button class="btn btn-primary" id="generateQRBtn">✅ QR बनाएँ</button>
            </div>
            <div class="qr-display">
                <img id="qrImage" src="" alt="QR कोड" />
                <div class="qr-data" id="qrDataDisplay">कोई QR नहीं</div>
            </div>
            <div style="text-align:center; margin-top:6px;">
                <button class="btn btn-outline btn-sm" id="downloadQRBtn">⬇️ डाउनलोड करें</button>
            </div>
        </div>

        <!-- TAB 2: SCANNER & BILL -->
        <div class="tab-content" id="tab-scan">
            <h2>📷 स्कैन & बिल</h2>

            <div id="scanner-container">
                <div id="reader" style="width:100%;"></div>
            </div>
            <div class="scanner-controls">
                <button class="btn btn-success btn-sm" id="startScanBtn">📷 चालू करें</button>
                <button class="btn btn-danger btn-sm" id="stopScanBtn">⏹️ रोकें</button>
                <button class="btn btn-outline btn-sm" id="clearBillBtn">🗑️ साफ़ करें</button>
            </div>
            <div class="scanner-status" id="scannerStatus">⏸️ कैमरा बंद है।</div>

            <!-- Bill Area -->
            <div class="bill-section">
                <div class="bill-header-info">
                    <span>📅 दिनांक: <strong id="billDate">-</strong></span>
                    <span>🕒 समय: <strong id="billTime">-</strong></span>
                </div>
                
                <div id="billItems">
                    <div class="empty-bill">कोई आइटम नहीं — उत्पाद स्कैन करें।</div>
                </div>

                <div class="bill-total">
                    <span>कुल योग</span>
                    <span class="total-amount" id="totalAmount">₹ 0.00</span>
                </div>

                <!-- WhatsApp Feature -->
                <div class="whatsapp-box">
                    <input type="tel" id="whatsappNum" placeholder="WhatsApp नंबर (जैसे 919876543210)" />
                    <button class="btn btn-whatsapp btn-sm" id="shareWhatsappBtn">📲 WhatsApp</button>
                </div>

                <div class="bill-actions">
                    <button class="btn btn-primary btn-sm" id="printBillBtn">🖨️ बिल प्रिंट करें</button>
                    <button class="btn btn-outline btn-sm" id="exportBillBtn">📤 डाउनलोड (.txt)</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // TAB SWITCHING
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = {
            generate: document.getElementById('tab-generate'),
            scan: document.getElementById('tab-scan'),
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                Object.keys(tabContents).forEach(key => {
                    tabContents[key].classList.toggle('active', key === tab);
                });
                if (tab !== 'scan') stopScanner();
            });
        });

        // 1. QR GENERATOR
        const shopInput = document.getElementById('shopName');
        const productInput = document.getElementById('productName');
        const priceInput = document.getElementById('productPrice');
        const generateBtn = document.getElementById('generateQRBtn');
        const qrImage = document.getElementById('qrImage');
        const qrDataDisplay = document.getElementById('qrDataDisplay');

        function generateQR() {
            const shop = shopInput.value.trim();
            const product = productInput.value.trim();
            const price = parseFloat(priceInput.value);
            if (!shop || !product || isNaN(price)) return;

            const data = JSON.stringify({ shop, product, price });
            const encoded = encodeURIComponent(data);
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?data=${encoded}&size=250x250&margin=10`;
            qrDataDisplay.textContent = `${shop} | ${product} | ₹${price.toFixed(2)}`;
        }

        generateBtn.addEventListener('click', generateQR);
        setTimeout(generateQR, 100);

        // 2. SCANNER & BILL
        let html5QrCode = null;
        let isScanning = false;
        let scannedItems = [];

        const scannerStatus = document.getElementById('scannerStatus');
        const startScanBtn = document.getElementById('startScanBtn');
        const stopScanBtn = document.getElementById('stopScanBtn');
        const billItems = document.getElementById('billItems');
        const totalAmount = document.getElementById('totalAmount');
        const scanCountBadge = document.getElementById('scanCount');
        const billDateEl = document.getElementById('billDate');
        const billTimeEl = document.getElementById('billTime');

        function updateDateTime() {
            const now = new Date();
            billDateEl.textContent = now.toLocaleDateString('hi-IN');
            billTimeEl.textContent = now.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
        }

        function renderBill() {
            updateDateTime();
            if (scannedItems.length === 0) {
                billItems.innerHTML = `<div class="empty-bill">कोई आइटम नहीं — उत्पाद स्कैन करें।</div>`;
                totalAmount.textContent = '₹ 0.00';
                scanCountBadge.textContent = '0 स्कैन';
                return;
            }
            let html = '';
            let total = 0;
            scannedItems.forEach((item) => {
                total += item.price;
                html += `
                    <div class="bill-item">
                        <div class="item-details">
                            <strong>${escapeHtml(item.product)}</strong>
                            <span class="shop">${escapeHtml(item.shop)}</span>
                        </div>
                        <div><strong>₹ ${item.price.toFixed(2)}</strong></div>
                    </div>
                `;
            });
            billItems.innerHTML = html;
            totalAmount.textContent = '₹ ' + total.toFixed(2);
            scanCountBadge.textContent = scannedItems.length + ' स्कैन';
        }

        function startScanner() {
            if (isScanning) return;
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    try {
                        const data = JSON.parse(decodedText);
                        if (data.shop && data.product && data.price !== undefined) {
                            scannedItems.push({ shop: data.shop, product: data.product, price: parseFloat(data.price) });
                            renderBill();
                            scannerStatus.textContent = `✅ स्कैन हुआ: ${data.product}`;
                        }
                    } catch (e) {
                        scannerStatus.textContent = '⚠️ अमान्य QR कोड';
                    }
                },
                () => {}
            ).then(() => {
                isScanning = true;
                scannerStatus.textContent = '📷 कैमरा चालू है...';
                startScanBtn.disabled = true;
                stopScanBtn.disabled = false;
            }).catch(err => {
                scannerStatus.textContent = '⚠️ कैमरा त्रुटि: ' + err;
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    scannerStatus.textContent = '⏸️ कैमरा बंद है।';
                    startScanBtn.disabled = false;
                    stopScanBtn.disabled = true;
                });
            }
        }

        startScanBtn.addEventListener('click', startScanner);
        stopScanBtn.addEventListener('click', stopScanner);
        document.getElementById('clearBillBtn').addEventListener('click', () => {
            if (scannedItems.length && confirm('बिल साफ़ करें?')) {
                scannedItems = [];
                renderBill();
            }
        });

        // WhatsApp Share
        document.getElementById('shareWhatsappBtn').addEventListener('click', () => {
            if (scannedItems.length === 0) {
                alert('बिल खाली है!');
                return;
            }
            let phone = document.getElementById('whatsappNum').value.trim();
            if (!phone) {
                alert('कृपया मोबाइल नंबर दर्ज करें!');
                return;
            }
            phone = phone.replace(/[^0-9]/g, ''); // Remove non-numeric characters

            let text = `🧾 *रसीद / बिल*\n`;
            text += `📅 दिनांक: ${billDateEl.textContent} | 🕒 समय: ${billTimeEl.textContent}\n`;
            text += `-------------------------------\n`;
            let total = 0;
            scannedItems.forEach((item, i) => {
                total += item.price;
                text += `${i+1}. ${item.product} - ₹${item.price.toFixed(2)}\n`;
            });
            text += `-------------------------------\n`;
            text += `*कुल योग: ₹${total.toFixed(2)}*\n\n`;
            text += `धन्यवाद! 🙏`;

            const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        });

        // Simple Mobile Print
        document.getElementById('printBillBtn').addEventListener('click', () => {
            if (scannedItems.length === 0) return alert('बिल खाली है।');
            
            const win = window.open('', '_blank', 'width=350,height=500');
            let itemsHtml = '';
            let total = 0;
            scannedItems.forEach(item => {
                total += item.price;
                itemsHtml += `<tr><td style="padding:4px 0;">${escapeHtml(item.product)}</td><td style="text-align:right;">₹${item.price.toFixed(2)}</td></tr>`;
            });

            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Bill</title>
                    <style>
                        body { font-family: courier, monospace; width: 280px; padding: 10px; margin: 0 auto; }
                        h2 { text-align: center; margin: 5px 0; font-size: 18px; }
                        p { font-size: 11px; margin: 2px 0; text-align: center; }
                        table { width: 100%; font-size: 12px; margin-top: 10px; border-collapse: collapse; }
                        .total { font-weight: bold; font-size: 14px; border-top: 1px dashed #000; padding-top: 5px; margin-top: 5px; text-align: right; }
                        .line { border-bottom: 1px dashed #000; margin: 5px 0; }
                    </style>
                </head>
                <body>
                    <h2>🧾 रसीद</h2>
                    <p>दिनांक: ${billDateEl.textContent} | ${billTimeEl.textContent}</p>
                    <div class="line"></div>
                    <table>${itemsHtml}</table>
                    <div class="line"></div>
                    <div class="total">कुल: ₹${total.toFixed(2)}</div>
                    <p style="margin-top:15px;">धन्यवाद! 🙏</p>
                </body>
                </html>
            `);
            win.document.close();
            win.focus();
            win.print();
        });

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        renderBill();
    </script>
</body>
</html>
