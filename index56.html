<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junction Live General Bheed Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #d93025;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .station-selector {
            background: #e8f0fe;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        select, input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            padding: 10px 18px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #1a73e8;
            padding-bottom: 5px;
        }
        .train-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .train-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .train-name {
            font-size: 16px;
            font-weight: bold;
            color: #1a73e8;
        }
        .train-time {
            background: #fce8e6;
            color: #c5221f;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        .coach-info {
            font-size: 14px;
            color: #444;
            margin-top: 8px;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge-high { color: #d93025; font-weight: bold; background: #fce8e6; padding: 3px 6px; border-radius: 4px; }
        .badge-medium { color: #b06000; font-weight: bold; background: #fef7e0; padding: 3px 6px; border-radius: 4px; }
        .badge-low { color: #137333; font-weight: bold; background: #e6f4ea; padding: 3px 6px; border-radius: 4px; }
        .search-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .search-area input { flex: 1; }
    </style>
</head>
<body onload="loadStationTrains()">

<div class="container">
    <h2>🚆 Junction Live General Bheed Tracker</h2>
    <div class="subtitle">Aapke nazdeeki ya chune gaye junction par agle 1 ghante mein aane wali trains aur General bheed ka live status</div>
    
    <!-- Station Selector -->
    <div class="station-selector">
        <div>
            <label for="stationSelect"><b>Apna Junction Chunein:</b></label><br>
            <select id="stationSelect" onchange="loadStationTrains()">
                <option value="NDLS">New Delhi Junction (NDLS)</option>
                <option value="CNB">Kanpur Central (CNB)</option>
                <option value="PNBE">Patna Junction (PNBE)</option>
                <option value="BJU">Barauni Junction (BJU)</option>
            </select>
        </div>
        <button onclick="detectLocation()">📍 Mera Location Detect Karein</button>
    </div>

    <!-- Manual Search Option -->
    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Ya Train Number / Naam se search karein...">
        <button onclick="searchManualTrain()">Search</button>
    </div>

    <div style="margin-top: 25px;">
        <div class="section-title" id="sectionHeading">Agle 1 Ghante Mein Aane Wali Trains (General Traffic)</div>
        <div id="trainsContainer"></div>
    </div>
</div>

<script>
    // Database: Alag-alag Junctions par aane wali trains aur unke General dabbo ki bheed
    const junctionDatabase = {
        "NDLS": [
            { number: "12556", name: "Gorakhdham Express", time: "11:15 AM (Agle 12 mins mein)", generalTraffic: "Bahut Zyada (Heavy Rush)", badge: "badge-high", details: "GS1: 150+ log khade hain | GS2: Full" },
            { number: "12301", name: "Howrah Rajdhani Express", time: "11:35 AM (Agle 32 mins mein)", generalTraffic: "N/A (Only AC)", badge: "badge-low", details: "General coach available nahi hai." },
            { number: "12951", name: "Mumbai Rajdhani", time: "12:10 PM (Agle 1 ghante mein)", generalTraffic: "Madhyam (Medium)", badge: "badge-medium", details: "GS1: Jagah uplabdh hai" }
        ],
        "CNB": [
            { number: "12301", name: "Howrah Rajdhani Express", time: "11:20 AM (Agle 17 mins mein)", generalTraffic: "N/A (Only AC)", badge: "badge-low", details: "AC Train - No General" },
            { number: "12556", name: "Gorakhdham Express", time: "11:45 AM (Agle 42 mins mein)", generalTraffic: "Bahut Zyada (Heavy Rush)", badge: "badge-high", details: "Platform par bhari bheed, dabbe full hain." }
        ],
        "PNBE": [
            { number: "13239", name: "Patna Kota Express", time: "11:10 AM (Agle 7 mins mein)", generalTraffic: "Bahut Zyada (Heavy Rush)", badge: "badge-high", details: "GS1 & GS2 dono me pair rakhne ki jagah nahi." },
            { number: "12393", name: "Sampoorna Kranti Express", time: "11:50 AM (Agle 47 mins mein)", generalTraffic: "Zyada (High Traffic)", badge: "badge-high", details: "General dabbe mein line lagi hai." }
        ],
        "BJU": [
            { number: "15203", name: "Barauni-Lucknow Express", time: "11:25 AM (Agle 22 mins mein)", generalTraffic: "Madhyam (Medium)", badge: "badge-medium", details: "Seats milne ki sambhavna hai." }
        ]
    };

    function loadStationTrains() {
        const stationCode = document.getElementById('stationSelect').value;
        const container = document.getElementById('trainsContainer');
        const heading = document.getElementById('sectionHeading');
        
        heading.innerText = `Junction (${stationCode}) Par Agle 1 Ghante Mein Aane Wali Trains`;
        container.innerHTML = "";

        const trains = junctionDatabase[stationCode] || [];

        if (trains.length === 0) {
            container.innerHTML = "<p style='color: #666; text-align: center;'>Agle 1 ghante mein koi train scheduled nahi hai.</p>";
            return;
        }

        trains.forEach(train => {
            container.innerHTML += `
                <div class="train-card">
                    <div class="train-header">
                        <span class="train-name">🚆 ${train.number} - ${train.name}</span>
                        <span class="train-time">⏱️ ${train.time}</span>
                    </div>
                    <div class="coach-info">
                        <span><b>General Bogi Bheed Status:</b> <span class="${train.badge}">${train.generalTraffic}</span></span>
                    </div>
                    <div style="font-size: 13px; color: #666; margin-top: 5px;">
                        📌 <b>Live Update:</b> ${train.details}
                    </div>
                </div>
            `;
        });
    }

    function detectLocation() {
        // Simulated GPS Detection
        alert("GPS Location Detect kiya gaya: New Delhi Junction (NDLS) ke kareeb hain.");
        document.getElementById('stationSelect').value = "NDLS";
        loadStationTrains();
    }

    function searchManualTrain() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('trainsContainer');
        const heading = document.getElementById('sectionHeading');

        if(query === "") {
            loadStationTrains();
            return;
        }

        heading.innerText = `Search Result for: "${query}"`;
        container.innerHTML = "";

        let found = false;
        for (let station in junctionDatabase) {
            junctionDatabase[station].forEach(train => {
                if (train.number.includes(query) || train.name.toLowerCase().includes(query)) {
                    found = true;
                    container.innerHTML += `
                        <div class="train-card">
                            <div class="train-header">
                                <span class="train-name">🚆 ${train.number} - ${train.name}</span>
                                <span class="train-time">Station: ${station} | Time: ${train.time}</span>
                            </div>
                            <div class="coach-info">
                                <span><b>General Bogi Bheed Status:</b> <span class="${train.badge}">${train.generalTraffic}</span></span>
                            </div>
                            <div style="font-size: 13px; color: #666; margin-top: 5px;">
                                📌 <b>Live Update:</b> ${train.details}
                            </div>
                        </div>
                    `;
                }
            });
        }

        if(!found) {
            container.innerHTML = "<p style='color: red; text-align: center;'>Koi train nahi mili!</p>";
        }
    }
</script>

</body>
</html>
