<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train Bheed Tracker - Updated MVP</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background:#eef1f6; margin:0; padding:12px; color:#222; }
  .container { max-width:760px; margin:auto; background:#fff; border-radius:14px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,.08); }
  h1 { font-size:20px; text-align:center; color:#c5221f; margin:0 0 4px; }
  .sub { text-align:center; font-size:12px; color:#666; margin-bottom:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab { flex:1; padding:9px; text-align:center; border-radius:8px; background:#e8f0fe; color:#1a73e8; font-weight:600; font-size:13px; cursor:pointer; }
  .tab.active { background:#1a73e8; color:#fff; }
  .panel { display:none; }
  .panel.active { display:block; }
  select, input[type=text], input[type=number], input[type=password] { width:100%; padding:10px; border:1px solid #ccd; border-radius:8px; font-size:14px; margin-bottom:8px; }
  button { padding:10px 16px; background:#1a73e8; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  button:active { transform:scale(.98); }
  .btn-red{background:#d93025;} .btn-yellow{background:#f29900;} .btn-green{background:#137333;} .btn-gray{background:#5f6368;}
  .card { border:1px solid #e0e3eb; border-radius:10px; padding:14px; margin-bottom:12px; background:#fcfdff; }
  .card h3 { margin:0 0 4px; font-size:15px; color:#1a73e8; }
  .meta { font-size:12px; color:#666; margin-bottom:8px; }
  .badge { padding:3px 9px; border-radius:20px; font-weight:700; font-size:12px; display:inline-block; }
  .b-high{background:#fce8e6;color:#c5221f;} .b-med{background:#fef7e0;color:#b06000;} .b-low{background:#e6f4ea;color:#137333;} .b-none{background:#eee;color:#777;}
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .row button { flex:1; min-width:100px; font-size:12px; padding:8px; }
  .coach { font-size:12px; background:#f1f3f9; border-radius:6px; padding:8px; margin-top:8px; }
  .sponsor-box { background:#fff8e1; border:1px dashed #e0a800; border-radius:8px; padding:10px; margin-bottom:14px; font-size:12px; color:#5c4400; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; opacity:0; transition:.3s; z-index:99; }
  .toast.show { opacity:1; }
  .empty { text-align:center; color:#888; padding:20px; font-size:14px; }
  .stat { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:#555; background:#f6f8fc; border-radius:6px; padding:8px 10px; margin-top:8px; flex-wrap:wrap; }
  .admin-list { font-size:13px; }
  .admin-list div { padding:8px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="container">
  <h1>🚆 Train Bheed Tracker</h1>
  <div class="sub">Live general coach crowd status — yatriyon ki report se</div>

  <!-- Sponsor / Ad Slot (Monetization / Update Area) -->
  <div class="sponsor-box">
    <span>📢 <b>Local / Ad Slot:</b> Yahan station ke paas ke offer ya ad dikhaye ja sakte hain.</span>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('search')">🔍 Search</div>
    <div class="tab" onclick="switchTab('report')">📝 Report</div>
    <div class="tab" onclick="switchTab('admin')">⚙️ Admin</div>
  </div>

  <!-- SEARCH PANEL -->
  <div id="panel-search" class="panel active">
    <label style="font-size:13px;font-weight:600;">Station chunein:</label>
    <select id="stationSel" onchange="renderSearch()">
      <option value="NDLS">New Delhi Junction (NDLS)</option>
      <option value="CNB">Kanpur Central (CNB)</option>
      <option value="PNBE">Patna Junction (PNBE)</option>
      <option value="BJU">Barauni Junction (BJU)</option>
    </select>
    <input type="text" id="searchBox" placeholder="Train number ya naam se search karein..." oninput="renderSearch()">
    <div id="searchResults"></div>
  </div>

  <!-- REPORT PANEL -->
  <div id="panel-report" class="panel">
    <label style="font-size:13px;font-weight:600;">Station:</label>
    <select id="repStation"></select>
    <label style="font-size:13px;font-weight:600;">Train:</label>
    <select id="repTrain" onchange="updateCoachHint()"></select>
    <label style="font-size:13px;font-weight:600;">Aap kis general coach mein hain? (optional)</label>
    <input type="number" id="repCoach" placeholder="Jaise: 3" min="1" max="20">
    <div class="coach" id="coachHint">Train chunein to general coach info dikhegi.</div>
    <label style="font-size:13px;font-weight:600;display:block;margin-top:10px;">Bheed kitni hai?</label>
    <div class="row">
      <button class="btn-green" onclick="submitReport('low')">🟢 Khali / Kam</button>
      <button class="btn-yellow" onclick="submitReport('med')">🟡 Madhyam</button>
      <button class="btn-red" onclick="submitReport('high')">🔴 Bahut Zyada</button>
    </div>
    <div class="stat">
      <span id="gpsStatus">📍 GPS: abhi check nahi hua</span>
      <button class="btn-gray" style="padding:5px 10px;font-size:12px;" onclick="checkGPS()">GPS Check</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="panel-admin" class="panel">
    <div id="adminLock">
      <h3 style="font-size:15px;margin-top:0;">Admin Login (PIN: 1234)</h3>
      <input type="password" id="adminPinInput" placeholder="4-digit PIN daalein">
      <button onclick="unlockAdmin()">Unlock Admin</button>
    </div>
    <div id="adminContent" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="font-size:15px;margin:0;">Reports Control</h3>
        <button class="btn-gray" style="padding:5px 10px;font-size:12px;" onclick="lockAdmin()">Lock</button>
      </div>
      <div class="admin-list" id="adminList"></div>
      <button class="btn-red" style="margin-top:10px;" onclick="clearAllReports()">🗑️ Sabhi reports clear karein</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PIN = "1234";
let adminUnlocked = false;

const STATIONS = {
  NDLS: { name: "New Delhi Junction", trains: [
    { no:"12556", name:"Gorakhdham Express", coaches: 12 },
    { no:"12951", name:"Mumbai Rajdhani", coaches: 8 }
  ]},
  CNB: { name: "Kanpur Central", trains: [
    { no:"12556", name:"Gorakhdham Express", coaches: 12 },
    { no:"12301", name:"Howrah Rajdhani Express", coaches: 8 }
  ]},
  PNBE: { name: "Patna Junction", trains: [
    { no:"13239", name:"Patna Kota Express", coaches: 12 }
  ]},
  BJU: { name: "Barauni Junction", trains: [
    { no:"15203", name:"Barauni-Lucknow Express", coaches: 12 }
  ]}
};

function reportKey(trainNo, stationCode) {
  return `${trainNo}_${stationCode}`;
}

function getReports() {
  return JSON.parse(localStorage.getItem('trainBheedReportsV2') || '{}');
}

function saveReports(r) {
  localStorage.setItem('trainBheedReportsV2', JSON.stringify(r));
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',
    (name==='search'&&i===0)||(name==='report'&&i===1)||(name==='admin'&&i===2)));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='admin') updateAdminView();
  if(name==='report') initReportForm();
}

function getValidReports(trainNo, stationCode) {
  const key = reportKey(trainNo, stationCode);
  const all = getReports()[key] || [];
  const now = Date.now();
  return all.filter(r => now - r.ts < 60*60*1000).sort((a,b)=>b.ts-a.ts);
}

function getLatestReport(trainNo, stationCode) {
  const valid = getValidReports(trainNo, stationCode);
  return valid.length ? valid[0] : null;
}

function timeAgo(ts) {
  const m = Math.floor((Date.now()-ts)/60000);
  if(m<1) return "abhi";
  if(m<60) return m+" min pehle";
  return Math.floor(m/60)+" ghante pehle";
}

function crowdInfo(level) {
  return level==='high'?{t:"Bahut Zyada",c:"b-high"}:
         level==='med'?{t:"Madhyam",c:"b-med"}:
         level==='low'?{t:"Khali / Kam",c:"b-low"}:{t:"Koi report nahi",c:"b-none"};
}

function renderSearch() {
  const st = document.getElementById('stationSel').value;
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  const box = document.getElementById('searchResults');
  box.innerHTML = "";

  let trains = STATIONS[st].trains;
  if(q) {
    trains = trains.filter(t => t.no.includes(q) || t.name.toLowerCase().includes(q));
  }
  if(!trains.length) {
    box.innerHTML = '<div class="empty">Koi train nahi mili.</div>';
    return;
  }

  trains.forEach(t => {
    const valid = getValidReports(t.no, st);
    const rep = valid.length ? valid[0] : null;
    const ci = crowdInfo(rep ? rep.level : 'none');
    const coachText = rep && rep.coach ? ` • Coach #${rep.coach}` : '';
    box.innerHTML += `
      <div class="card">
        <h3>🚆 ${t.no} — ${t.name}</h3>
        <div class="meta">${STATIONS[st].name} (${st}) • General coaches: ${t.coaches}</div>
        <div><b>Bheed:</b> <span class="badge ${ci.c}">${ci.t}</span></div>
        <div class="meta" style="margin-top:6px;">
          ${rep ? `🕒 ${timeAgo(rep.ts)} • 👥 ${valid.length} reports${coachText} • 📱 ${rep.source}` : 'Abhi koi live report nahi'}
        </div>
        <div class="row">
          <button class="btn-green" onclick="quickReport('${t.no}','${st}','low')">🟢 Khali</button>
          <button class="btn-yellow" onclick="quickReport('${t.no}','${st}','med')">🟡 Madhyam</button>
          <button class="btn-red" onclick="quickReport('${t.no}','${st}','high')">🔴 Bhid</button>
        </div>
      </div>`;
  });
}

function quickReport(trainNo, stationCode, level) {
  const key = reportKey(trainNo, stationCode);
  const all = getReports();
  all[key] = all[key] || [];
  const recent = all[key].filter(r => Date.now()-r.ts < 5*60*1000);
  if(recent.length > 0) {
    toast("⏳ 5 min mein ek hi report allowed hai.");
    return;
  }
  all[key].push({ level, ts: Date.now(), station: stationCode, coach: null, source: "quick-report" });
  saveReports(all);
  toast("Report save ho gayi! Dhanyawad 🙏");
  renderSearch();
}

function initReportForm() {
  const stSel = document.getElementById('repStation');
  if(!stSel.options.length) {
    stSel.innerHTML = Object.keys(STATIONS).map(k=>`<option value="${k}">${STATIONS[k].name} (${k})</option>`).join('');
  }
  stSel.onchange = fillTrains;
  fillTrains();
}

function fillTrains() {
  const st = document.getElementById('repStation').value;
  const tSel = document.getElementById('repTrain');
  tSel.innerHTML = STATIONS[st].trains.map(t=>`<option value="${t.no}">${t.no} - ${t.name}</option>`).join('');
  updateCoachHint();
}

function updateCoachHint() {
  const st = document.getElementById('repStation').value;
  const no = document.getElementById('repTrain').value;
  const t = STATIONS[st].trains.find(x=>x.no===no);
  document.getElementById('coachHint').innerHTML = t ?
    `ℹ️ Is train mein approx <b>${t.coaches} general coaches</b> hain. Aam taur par yeh engine ke aage/peeche hote hain.` : '';
}

let gpsFlag = "manual";
function checkGPS() {
  const el = document.getElementById('gpsStatus');
  if(!navigator.geolocation) {
    el.textContent = "📍 GPS support nahi hai";
    gpsFlag = "manual";
    return;
  }
  el.textContent = "📍 GPS check ho raha hai...";
  navigator.geolocation.getCurrentPosition(
    p => {
      const speed = p.coords.speed ? p.coords.speed * 3.6 : 0;
      if(speed > 15) {
        gpsFlag = `gps-moving (${speed.toFixed(0)} km/h)`;
        el.innerHTML = `📍 Speed ${speed.toFixed(1)} km/h — <b style="color:#137333">Safar mein lagta hai ✓</b>`;
      } else {
        gpsFlag = "gps-stationary";
        el.innerHTML = `📍 Speed ${speed.toFixed(1)} km/h — <b style="color:#b06000">Station/rukav par lagta hai</b>`;
      }
    },
    () => {
      gpsFlag = "manual";
      el.textContent = "📍 GPS permission nahi mili — manual report allowed";
    }
  );
}

function submitReport(level) {
  const st = document.getElementById('repStation').value;
  const no = document.getElementById('repTrain').value;
  const coach = document.getElementById('repCoach').value;
  const key = reportKey(no, st);
  const all = getReports();
  all[key] = all[key] || [];

  const recent = all[key].filter(r => Date.now()-r.ts < 5*60*1000);
  if(recent.length > 0) {
    toast("⏳ Aapne 5 min se kam samay pehle report ki hai.");
    return;
  }

  all[key].push({
    level,
    ts: Date.now(),
    station: st,
    coach: coach ? parseInt(coach, 10) : null,
    source: gpsFlag
  });
  saveReports(all);
  document.getElementById('repCoach').value = "";
  toast("✅ Report submit ho gayi! Dhanyawad.");
  switchTab('search');
  document.getElementById('stationSel').value = st;
  renderSearch();
}

function unlockAdmin() {
  const pin = document.getElementById('adminPinInput').value.trim();
  if(pin === ADMIN_PIN) {
    adminUnlocked = true;
    document.getElementById('adminPinInput').value = "";
    updateAdminView();
    toast("Admin unlocked");
  } else {
    toast("❌ Galat PIN");
  }
}

function lockAdmin() {
  adminUnlocked = false;
  updateAdminView();
}

function updateAdminView() {
  document.getElementById('adminLock').style.display = adminUnlocked ? "none" : "block";
  document.getElementById('adminContent').style.display = adminUnlocked ? "block" : "none";
  if(adminUnlocked) renderAdmin();
}

function renderAdmin() {
  const all = getReports();
  const box = document.getElementById('adminList');
  const keys = Object.keys(all);
  if(!keys.length) {
    box.innerHTML = '<div class="empty">Koi report nahi.</div>';
    return;
  }
  let html = "";
  keys.forEach(key => {
    const reports = all[key];
    const [no, st] = key.split('_');
    const latest = reports.length ? reports.sort((a,b)=>b.ts-a.ts)[0] : null;
    const ci = crowdInfo(latest ? latest.level : 'none');
    html += `<div>
      <span>🚆 ${no} (${st || '-'}) — ${reports.length} reports — <span class="badge ${ci.c}">${ci.t}</span></span>
      <button class="btn-gray" style="padding:4px 8px;font-size:11px;" onclick="deleteTrainReports('${key}')">Delete</button>
    </div>`;
  });
  box.innerHTML = html;
}

function deleteTrainReports(key) {
  const all = getReports();
  delete all[key];
  saveReports(all);
  renderAdmin();
  toast("Reports delete ho gayi.");
}

function clearAllReports() {
  if(confirm("Sabhi reports delete karein?")) {
    localStorage.removeItem('trainBheedReportsV2');
    renderAdmin();
    toast("Sab clear ho gaya.");
  }
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

renderSearch();
</script>
</body>
</html>
